<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#20345b"><title>Hardware Lab · Ms. Kaple’s STEM</title><style>
:root{--ink:#20345b;--muted:#596b86;--bg:#f3f7ff;--blue:#2864df;--line:#dbe5f4;--lav:#ece7ff;--sky:#deebff;--good:#176247;--bad:#9b302b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px 'Trebuchet MS',Arial,sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:12px;padding:12px 18px;font-weight:bold}button:hover{border-color:var(--blue)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fbad43;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.6}header{max-width:1200px;margin:auto;padding:22px 28px;display:flex;gap:20px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:bold;display:flex;gap:12px;align-items:center}.logo{background:var(--ink);color:white;padding:10px;border-radius:13px;transform:rotate(-6deg)}main{max-width:1140px;margin:auto;padding:34px 28px 45px}h1{font-size:clamp(34px,5vw,54px);line-height:1.08;letter-spacing:-1.5px;margin:10px 0 16px}h2{font-size:28px;margin:0 0 16px;letter-spacing:-.5px}h3{font-size:21px;margin:8px 0 14px}p{line-height:1.55;margin:10px 0 18px}.muted,small{color:var(--muted)}.eyebrow{color:var(--blue);font-size:13px;text-transform:uppercase;letter-spacing:2px;font-weight:bold}.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;align-items:center;margin-bottom:28px}.hero p{max-width:570px;color:var(--muted)}.herophotos{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:28px;background:var(--lav);padding:24px}.herophotos img{width:46%;height:125px;object-fit:contain;mix-blend-mode:multiply}.panel{background:white;border:1px solid var(--line);border-radius:19px;padding:24px;margin:18px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.actions,.chips{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.primary{background:var(--blue);color:white;border-color:var(--blue)}.secondary{background:var(--lav);border-color:#d7cef8}.quiet{background:none;font-size:14px}.active{background:var(--ink)!important;color:white!important;border-color:var(--ink)!important}.chip{font-size:14px;padding:10px 13px}.numbers{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin:18px 0}.numbers button{padding:12px 5px}.numbers.names{grid-template-columns:repeat(4,1fr)}.criteria{display:grid;gap:10px;padding-left:24px;line-height:1.5}.badge{display:inline-block;padding:8px 13px;background:var(--sky);border-radius:24px;font-size:14px;font-weight:bold}.badge.purple{background:var(--lav)}.menu{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin:25px 0}.device{padding:15px;text-align:center;background:white;border:1px solid var(--line);border-radius:16px}.device img{width:100%;height:108px;object-fit:contain}.device b{display:block;margin:8px 0;font-size:16px}.device p{font-size:14px;line-height:1.4}.listen{font-size:14px;padding:9px 12px;border-radius:24px}.progress{height:9px;border-radius:20px;background:#dce6f6;overflow:hidden;margin:18px 0}.progress i{display:block;height:100%;background:var(--blue)}.question{max-width:910px;margin:auto}.question h2{font-size:29px;line-height:1.3;margin:16px 0}.question-photo{width:100%;height:200px;object-fit:contain;background:white;border-radius:16px;margin:5px 0 16px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.choice{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--line);background:white;border-radius:15px;overflow:hidden}.choice.selected{border-color:var(--blue);background:#edf4ff}.choice>button:first-child{border:0;background:none;flex:1;min-height:75px;text-align:left;font-size:20px;padding:18px}.choice>button:first-child img{display:block;width:100%;height:120px;object-fit:contain;margin-bottom:12px}.choice>button.listen{margin-right:10px;padding:8px}.choices.pictures{grid-template-columns:repeat(3,1fr)}.reason .choice>button:first-child{font-size:18px}.feedback{padding:18px;border-radius:14px;margin-top:18px;background:#edf7f1;border:1px solid #c8e2d6;color:var(--good);line-height:1.5}.feedback.fix{background:#fff4ec;color:#78452b;border-color:#f4d8bd}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{background:var(--sky);border-radius:15px;padding:20px}.stat b{font-size:32px;display:block}.stat span{font-size:14px}.reflect{display:grid;gap:12px}.reflectrow{border:1px solid var(--line);border-radius:14px;padding:18px}.stars{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.stars button{font-size:15px}.notice{background:#fff4e8;border:1px solid #f0d9b7;padding:16px;border-radius:12px;margin:14px 0;line-height:1.45}.error{background:#fff0ef;color:var(--bad);padding:15px;border-radius:12px;margin:12px 0}.ok{color:var(--good)}.field{display:grid;gap:8px;margin:15px 0}.field label{font-size:15px;font-weight:bold}input,textarea{width:100%;background:white;padding:12px;border:1px solid #becde3;border-radius:9px}textarea{min-height:130px;resize:vertical}.links{display:grid;gap:12px}.linkrow{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center}.linkrow input{font-size:13px}.results details{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0;background:white}.results summary{cursor:pointer;font-size:16px;font-weight:bold;line-height:1.5}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;min-width:100px}th{background:var(--bg)}footer{max-width:1084px;margin:0 auto 25px;border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--muted)}.loading{padding:80px 20px;text-align:center}.hidden{display:none!important}@media(max-width:850px){.hero{grid-template-columns:1fr 1fr;gap:18px}.menu{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.linkrow{grid-template-columns:1fr}.choices.pictures{grid-template-columns:repeat(3,1fr)}.choice>button.listen{margin-right:5px}}@media(max-width:600px){header{padding:16px}.brand{font-size:19px}main{padding:24px 16px}.hero{grid-template-columns:1fr}.herophotos{display:none}.menu{grid-template-columns:repeat(2,1fr)}.numbers{grid-template-columns:repeat(6,1fr)}.numbers.names{grid-template-columns:repeat(3,1fr)}.choices,.choices.pictures,.stats{grid-template-columns:1fr}.choice>button:first-child img{height:100px}.panel{padding:18px}.question h2{font-size:25px}.question-photo{height:160px}.choice>button:first-child{min-height:60px}.stats{gap:8px}.stat b{font-size:25px}footer{margin:0 16px 20px}}

body:has(.menu-page)>header{height:64px;padding:10px 28px}body:has(.menu-page)>footer{display:none}
main.menu-page{height:calc(100svh - 64px);padding:12px 28px 16px}.menu-shell{height:100%;display:flex;flex-direction:column;gap:0}.menu-heading{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px}.menu-heading h2{font-size:25px;margin:0}.menu-heading p{font-size:15px;line-height:1.35;margin:4px 0 0}.picture-menu{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 10px;flex:1;min-height:0}.menu-tile{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:5px;min-height:0;min-width:0;padding:9px 12px;background:white;border:1px solid var(--line);border-radius:14px;text-align:center}.menu-tile:hover{background:#edf4ff}.menu-tile img{width:100%;height:100%;min-height:0;object-fit:contain}.menu-tile span{font-size:16px;line-height:1.2;display:block}.menu-tile .sound{font-size:14px;display:inline}.menu-detail{flex:none;min-height:44px;padding:10px 15px;border-radius:12px;background:var(--sky);font-size:15px;line-height:1.4;margin:0 0 10px}.menu-bottom{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px}.menu-bottom button{font-size:15px;padding:11px 16px}.menu-page .notice,.menu-page .error{padding:8px 12px;margin:0 0 8px;font-size:14px}
@media(min-width:750px) and (max-height:620px){.menu-heading h2{font-size:22px}.menu-heading p{font-size:14px}.picture-menu{gap:7px;margin:8px 0}.menu-tile{padding:6px 9px;gap:3px}.menu-tile span{font-size:14px}.menu-detail{min-height:37px;padding:7px 12px;font-size:14px}.menu-bottom button{font-size:14px;padding:9px 12px}}
@media(max-width:749px){main.menu-page{height:auto;padding:20px 16px}.menu-heading{align-items:flex-start}.menu-heading h2{font-size:23px}.menu-heading .badge{font-size:12px}.picture-menu{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(5,135px);flex:none}.menu-tile{padding:8px}.menu-tile span{font-size:14px}.menu-bottom{align-items:stretch;flex-direction:column}.menu-bottom .actions{justify-content:center}}
@media(max-width:420px){.picture-menu{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;grid-auto-rows:145px}}

</style></head><body><header><div class="brand"><span class="logo" aria-hidden="true">▣</span> Hardware Lab</div><button class="quiet" data-action="teacher">Teacher</button></header><main id="app"><div class="loading">Getting your STEM lab ready…</div></main><footer>Ms. Kaple’s STEM · Second Grade · Identify it. Choose it. Explain it.</footer><script>
const criteria = [
'I can identify hardware by its name.',
'I can choose the right hardware for 3 different tasks.',
'I can explain why I picked that hardware for each task.'
];
const hardware = [
{id:'laptop',name:'Laptop computer',use:'A portable computer with a keyboard and screen.'},
{id:'desktop',name:'Desktop computer',use:'A computer setup that usually stays at a desk.'},
{id:'mouse',name:'Mouse',use:'Moves the cursor so you can point and click.'},
{id:'keyboard',name:'Keyboard',use:'Types letters, numbers, and words.'},
{id:'speakers',name:'Speakers',use:'Play sound so people can hear it.'},
{id:'monitor',name:'Monitor',use:'Displays pictures and words from a computer.'},
{id:'camera',name:'Digital camera',use:'Takes photos and can record videos.'},
{id:'projector',name:'Projector',use:'Projects a large image onto a surface.'},
{id:'screen',name:'Projection screen',use:'A surface where a projector shows an image.'},
{id:'microphone',name:'Microphone',use:'Captures your voice to record it or send it to speakers.'},
{id:'document-camera',name:'Document camera',use:'Shows paper or objects to a class through a connected display.'},
{id:'tablet',name:'Tablet',use:'A portable computer with a touch screen.'},
{id:'smartboard',name:'SMART board',use:'A large interactive classroom display.'},
{id:'phone',name:'Phone',use:'Makes calls, sends messages, and can take photos.'},
{id:'printer',name:'Printer',use:'Makes a paper copy of words or pictures.'}
];
const identify=(id,answer,options,phase)=>({id,phase,type:'identify',prompt:'What is the name of this hardware?',image:answer,answer,options});
const practice=[
identify('p1','tablet',['tablet','keyboard','printer','speakers'],'practice'),
identify('p2','phone',['phone','mouse','projector','monitor'],'practice'),
identify('p3','projector',['projector','screen','camera','desktop'],'practice'),
identify('p4','screen',['screen','monitor','smartboard','laptop'],'practice'),
identify('p5','smartboard',['smartboard','screen','printer','document-camera'],'practice')
];
const identification=[
identify('i1','laptop',['laptop','desktop','tablet','monitor'],'identify'),
identify('i2','desktop',['desktop','laptop','monitor','smartboard'],'identify'),
identify('i3','mouse',['mouse','keyboard','microphone','camera'],'identify'),
identify('i4','keyboard',['keyboard','speakers','printer','screen'],'identify'),
identify('i5','speakers',['speakers','microphone','mouse','phone'],'identify'),
identify('i6','monitor',['monitor','screen','tablet','projector'],'identify'),
identify('i7','camera',['camera','document-camera','phone','projector'],'identify'),
identify('i8','microphone',['microphone','speakers','mouse','printer'],'identify'),
identify('i9','document-camera',['document-camera','camera','projector','keyboard'],'identify'),
identify('i10','printer',['printer','desktop','screen','speakers'],'identify')
];
const scenario=(id,prompt,answer,options,reasons,phase)=>({id,type:'task',phase,prompt,answer,options,reasons,reasonAnswer:0});
const tasks=[
scenario('t1','You already have a photo on your computer. You want a paper copy to hang on the wall. Which hardware will make the paper copy?','printer',['printer','monitor','camera'],['It puts the photo onto paper.','It only shows the photo on a screen.','It captures a new photo.'],'task'),
scenario('t2','You are using a desktop computer. You want to type a story. Which hardware will you use to enter the words?','keyboard',['keyboard','mouse','speakers'],['Its keys let me type words.','It makes the story louder.','It prints my story on paper.'],'task'),
scenario('t3','A song is already playing on the computer. The whole table needs to hear it. Which hardware plays the sound out loud?','speakers',['speakers','microphone','monitor'],['It plays sound that people can hear.','It captures my voice.','It shows words and pictures.'],'task')
];
const extension=[
scenario('x1','You want to play a learning game in the car. There is no desk or wall outlet. Which of these is the best choice?','tablet',['tablet','desktop','printer'],['It is portable and can run a game on battery power.','It makes a paper copy of the game.','It needs to stay at a desk.'],'extension'),
scenario('x2','The teacher needs to project a slideshow onto a large, blank projection screen. Which hardware sends the image onto it?','projector',['projector','speakers','mouse'],['It projects a large image onto the screen.','It only plays sound.','It only moves the cursor.'],'extension'),
scenario('x3','The teacher is drawing on real paper. Everyone needs to see her hand and drawing live on the classroom display. Which hardware is designed for this?','document-camera',['document-camera','keyboard','printer'],['It sends a live view of the paper and objects to a display.','It types the drawing into words.','It makes a paper copy of the display.'],'extension'),
scenario('x4','You want to take a new photo of your dog playing outside. Which of these can capture the photo?','camera',['camera','monitor','mouse'],['It captures a new photograph.','It only displays an existing photograph.','It moves the cursor on a computer.'],'extension'),
scenario('x5','You want to record your voice telling a story. Which of these captures your voice?','microphone',['microphone','speakers','screen'],['It captures sound from my voice.','It only plays a sound that is already recorded.','It is a surface for a projected image.'],'extension')
];
const allQuestions=[...practice,...identification,...tasks,...extension];
function mark(answers,phase){const qs=allQuestions.filter(q=>q.phase===phase);return {correct:qs.filter(q=>answers.find(a=>a.id===q.id)?.choice===q.answer).length,total:qs.length,reasons:qs.filter(q=>q.type==='task'&&answers.find(a=>a.id===q.id)?.choice===q.answer&&answers.find(a=>a.id===q.id)?.reason===q.reasonAnswer).length};}
function validateAnswers(answers,phases){const qs=allQuestions.filter(q=>phases.includes(q.phase));return Array.isArray(answers)&&answers.length===qs.length&&new Set(answers.map(a=>a.id)).size===qs.length&&qs.every(q=>{const a=answers.find(a=>a.id===q.id);return a&&q.options.includes(a.choice)&&(q.type!=='task'||Number.isInteger(a.reason)&&a.reason>=0&&a.reason<q.reasons.length)});}

const models=[identify('m1','keyboard',['keyboard','speakers','printer','mouse'],'model'),scenario('m2','You need to move the cursor and click a button on a desktop computer. Which hardware fits the job?','mouse',['mouse','printer','speakers'],['It lets me point and click.','It makes a paper copy.','It plays sound out loud.'],'model')];

const images={"laptop":"https://trackpad-trails-kaple.rockylynx12.chatgpt.site/hardware-assets/laptop.webp","desktop":"https://trackpad-trails-kaple.rockylynx12.chatgpt.site/hardware-assets/desktop.webp","keyboard":"https://trackpad-trails-kaple.rockylynx12.chatgpt.site/hardware-assets/keyboard.webp","mouse":"https://trackpad-trails-kaple.rockylynx12.chatgpt.site/hardware-assets/mouse.webp","speakers":"https://trackpad-trails-kaple.rockylynx12.chatgpt.site/hardware-assets/speakers.webp","monitor":"https://trackpad-trails-kaple.rockylynx12.chatgpt.site/hardware-assets/monitor.webp","camera":"https://trackpad-trails-kaple.rockylynx12.chatgpt.site/hardware-assets/camera.webp","projector":"https://trackpad-trails-kaple.rockylynx12.chatgpt.site/hardware-assets/projector.webp","screen":"https://trackpad-trails-kaple.rockylynx12.chatgpt.site/hardware-assets/screen.webp","microphone":"https://trackpad-trails-kaple.rockylynx12.chatgpt.site/hardware-assets/microphone.webp","document-camera":"https://trackpad-trails-kaple.rockylynx12.chatgpt.site/hardware-assets/document-camera.webp","smartboard":"https://trackpad-trails-kaple.rockylynx12.chatgpt.site/hardware-assets/smartboard.webp","tablet":"https://trackpad-trails-kaple.rockylynx12.chatgpt.site/hardware-assets/tablet.webp","phone":"https://trackpad-trails-kaple.rockylynx12.chatgpt.site/hardware-assets/phone.webp","printer":"https://trackpad-trails-kaple.rockylynx12.chatgpt.site/hardware-assets/printer.webp"};
const API='https://trackpad-trails-kaple.rockylynx12.chatgpt.site/api/hardware';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getHW=id=>hardware.find(h=>h.id===id),name=id=>getHW(id)?.name||id;
const pic=(id,alt)=>`<img src="${images[id]}" alt="${esc(alt??name(id))}">`;
let config,student={className:'',number:0},screen='home',mode='main',stage='practice',index=0,answers=[],ratings=[0,0,0],choice=null,reason=null,checked=false,busy=false,error='',notice='',resultId='',mainId='',mainSaved=false,extensionSaved=false,teacherCode='',teacherData=null,teacherClass='',teacherTab='results';
const requestedClass=new URLSearchParams(location.search).get('class')||'';
const uid=()=>`hw-${crypto.randomUUID()}`;
const draftKey=()=>`hardware-lab-v1:${student.className}:${student.number}`;
function writeDraft(){if(!student.number||stage==='model')return;try{localStorage.setItem(draftKey(),JSON.stringify({mode,stage,index,answers,ratings,resultId,mainId,mainSaved,extensionSaved,screen}));}catch{}}
function readDraft(){try{return JSON.parse(localStorage.getItem(draftKey())||'null')}catch{return null}}
function speak(t){if(!('speechSynthesis'in window)){notice='Read-aloud is not available on this browser. Ask your teacher for reading help.';render();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.87;speechSynthesis.speak(u)}
const listen=(action='read',value='')=>`<button class="listen" data-action="${action}" data-value="${esc(value)}" aria-label="Read aloud">🔊 Listen</button>`;
function banner(){return error?`<div class="error" role="alert">${esc(error)}</div>`:notice?`<div class="notice" role="status">${esc(notice)}</div>`:''}
async function api(method='GET',data,teacher=false){const c=new AbortController(),timer=setTimeout(()=>c.abort(),15000);try{const r=await fetch(API+(teacher?'?teacher=1':''),{method,signal:c.signal,headers:{...(data?{'Content-Type':'application/json'}:{}),...(teacher?{Authorization:'Bearer '+teacherCode}:{})},...(data?{body:JSON.stringify(data)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error||'Please try again.');return j}finally{clearTimeout(timer)}}
async function boot(){try{config=await api();student.className=config.classes.includes(requestedClass)?requestedClass:'';render()}catch{error='We could not load the class list. Check your connection and try again.';$('app').innerHTML=banner()+'<button class="primary" data-action="retry">Try again</button>'}}
const openExtension=()=>config.classLocks?.[student.className]??config.extensionOpen;
function home(){const roster=config.rosters?.[student.className]||[],names=roster.some(Boolean);return `<div class="hero"><div><div class="eyebrow">Ms. Kaple’s STEM · Grade 2</div><h1>Meet your<br>hardware.</h1><p>Hardware is the physical technology we can touch. Learn its name, choose a tool, and tell why it fits the job.</p><span class="badge">Independent digital activity</span></div><div class="herophotos">${pic('laptop')}${pic('camera')}</div></div><div class="grid2"><section class="panel"><h2>1. Choose your class</h2><div class="chips">${config.classes.map(c=>`<button class="chip ${student.className===c?'active':''}" data-action="class" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div><h3 style="margin-top:24px">2. Choose your number${names?' or name':''}</h3><p class="muted">Use your classroom number.</p>${student.className?`<div class="numbers ${names?'names':''}">${Array.from({length:config.maxNumber},(_,i)=>`<button data-action="student" data-value="${i+1}" class="${student.number===i+1?'active':''}" aria-pressed="${student.number===i+1}">${i+1}${roster[i]?'<br>'+esc(roster[i]):''}</button>`).join('')}</div>`:'<p>Choose your class first.</p>'}<button class="primary" data-action="enter" ${!student.number?'disabled':''}>Enter the lab →</button></section><section class="panel"><div class="row"><h2>Our goal</h2>${listen('criteria')}</div><p><b>I can identify hardware and choose the best hardware for a task.</b></p><h3>I know I’ve got it when…</h3><ul class="criteria">${criteria.map(c=>`<li>${c}</li>`).join('')}</ul><p class="muted">Look at the picture menu. Try 5 practice questions, identify 10 hardware pictures, and solve 3 tasks.</p></section></div>${banner()}`}
function menu(){return `<section class="menu-shell"><div class="menu-heading"><div><h2>Technology menu · All 15 tools</h2><p>Click any picture to hear its name and job.</p></div><span class="badge">${esc(student.className)} · #${student.number}</span></div><div class="picture-menu" aria-label="All 15 hardware tools">${hardware.map(h=>`<button class="menu-tile" data-action="device" data-value="${h.id}" aria-label="Hear about ${esc(h.name)}">${pic(h.id,'')}<span>${h.name} <span class="sound" aria-hidden="true">🔊</span></span></button>`).join('')}</div><div class="menu-detail" id="menu-detail" aria-live="polite">Choose a picture to learn what that tool does.</div>${banner()}<div class="menu-bottom"><button data-action="home">Change student</button><div class="actions">${readDraft()?'<button class="secondary" data-action="resume">Continue saved work</button>':''}<button class="primary" data-action="start">Start 5 practice questions →</button></div></div></section>`}
function current(){return (stage==='model'?models:stage==='practice'?practice:stage==='identify'?identification:stage==='task'?tasks:extension)[index]}
function options(q){return [...q.options].sort((a,b)=>hash(q.id+a)-hash(q.id+b))}function hash(s){return [...s].reduce((n,c)=>(n*31+c.charCodeAt(0))>>>0,29)}
function question(){const q=current(),list=stage==='model'?models:stage==='practice'?practice:stage==='identify'?identification:stage==='task'?tasks:extension,labels={model:'Class demonstration · not scored',practice:'Practice with feedback',identify:'Identify the hardware',task:'Choose the right tool',extension:'Extension · What the Tech?'};return `<section class="question"><div class="row"><span class="badge ${stage==='extension'?'purple':''}">${labels[stage]}</span><span class="muted">${index+1} of ${list.length} · ${stage==='model'?'Teacher model':'#'+student.number}</span></div><div class="progress"><i style="width:${(index/list.length)*100}%"></i></div><div class="panel"><div class="row"><span class="eyebrow">${q.type==='identify'?'Name this tool':'Think about the task'}</span>${listen()}</div><h2 tabindex="-1" id="question-title">${q.prompt}</h2>${q.type==='identify'?`<img class="question-photo" src="${images[q.image]}" alt="Hardware to identify">`:''}<div class="choices ${q.type==='task'?'pictures':''}">${options(q).map(id=>`<div class="choice ${choice===id?'selected':''}"><button data-action="choice" data-value="${id}" ${checked?'disabled':''} aria-pressed="${choice===id}">${q.type==='task'?pic(id):''}${name(id)}</button>${listen('choice-read',id)}</div>`).join('')}</div>${q.type==='task'&&choice?`<div class="reason"><div class="row"><h3 style="margin-top:24px">I would choose ${name(choice)} because…</h3>${listen('reasons')}</div><div class="choices">${reasonOrder(q).map(i=>`<div class="choice ${reason===i?'selected':''}"><button data-action="reason" data-value="${i}" ${checked?'disabled':''} aria-pressed="${reason===i}">${q.reasons[i]}</button>${listen('reason-read',String(i))}</div>`).join('')}</div></div>`:''}${checked?`<div class="feedback ${choice!==q.answer||q.type==='task'&&reason!==q.reasonAnswer?'fix':''}" role="status">${feedback(q)} ${listen('feedback')}</div>`:''}${banner()}<div class="row" style="margin-top:24px"><small>${['practice','model'].includes(stage)?'Practice does not count toward your score.':'Choose carefully. Your first answer is recorded.'}</small>${checked?'<button class="primary" data-action="next">Next →</button>':`<button class="primary" data-action="check" ${!choice||q.type==='task'&&reason===null?'disabled':''}>Check my answer</button>`}</div></div></section>`}
function reasonOrder(q){const a=[0,1,2],n=hash(q.id)%3;return a.slice(n).concat(a.slice(0,n))}
function feedback(q){return `${choice===q.answer&&(q.type!=='task'||reason===q.reasonAnswer)?'You’ve got it!':'Let’s learn from this.'} ${name(q.answer)}. ${q.type==='task'?q.reasons[q.reasonAnswer]:getHW(q.answer).use}`}
function summaryStats(){const i=mark(answers,'identify'),t=mark(answers,'task');return `<div class="stats"><div class="stat"><b>${i.correct}/10</b><span>Hardware names</span></div><div class="stat"><b>${t.correct}/3</b><span>Tools chosen for tasks</span></div><div class="stat"><b>${t.reasons}/3</b><span>Reasons selected</span></div></div>`}
function reflection(){const missed=[...identification,...tasks].filter(q=>{const a=answers.find(a=>a.id===q.id);return a?.choice!==q.answer||q.type==='task'&&a?.reason!==q.reasonAnswer});return `<section class="question"><span class="eyebrow">Check your tech!</span><h1>How did you do?</h1>${summaryStats()}${missed.length?`<details class="panel"><summary>Review ${missed.length} question${missed.length===1?'':'s'} to keep practicing</summary>${missed.map(q=>`<p><b>${name(q.answer)}</b> — ${q.type==='task'?q.reasons[q.reasonAnswer]:getHW(q.answer).use}</p>`).join('')}</details>`:'<p class="ok">You identified every tool and chose the right hardware and reasons!</p>'}<div class="panel"><div class="row"><h2>My success criteria</h2>${listen('criteria')}</div><p>Be honest about what you can do today.</p><div class="reflect">${criteria.map((c,i)=>`<div class="reflectrow"><b>${c}</b><div class="stars">${[1,2,3].map(n=>`<button data-action="rating" data-value="${i}:${n}" class="${ratings[i]===n?'active':''}" aria-pressed="${ratings[i]===n}">${'⭐'.repeat(n)} ${['','I need help','With a reminder','By myself'][n]}</button>`).join('')}</div></div>`).join('')}</div>${banner()}<button class="primary" style="margin-top:22px" data-action="save" ${ratings.some(x=>!x)||busy?'disabled':''}>${busy?'Saving…':'Save my work →'}</button></div></section>`}
function done(){const x=mark(answers,'extension');return `<section class="question"><span class="eyebrow">Work saved</span><h1>Nice thinking,<br>hardware expert.</h1><p class="ok">✓ Your teacher can see your work for ${esc(student.className)}, #${student.number}.</p>${mode==='main'?summaryStats():`<div class="stats"><div class="stat"><b>${x.correct}/5</b><span>Extension hardware choices</span></div><div class="stat"><b>${x.reasons}/5</b><span>Extension reasons</span></div></div>`}<div class="panel"><span class="badge purple">Extension</span><h2 style="margin-top:16px">What the Tech?</h2><p>Try 5 new situations. Choose the best hardware and tell why it fits the job.</p><button class="primary" data-action="extension" ${!openExtension()||extensionSaved?'disabled':''}>${extensionSaved?'Extension saved ✓':openExtension()?'Start the extension →':'🔒 Your teacher has locked this extension'}</button></div>${banner()}<div class="actions"><button data-action="menu">Review the picture menu</button><button data-action="home">Finish / next student</button></div></section>`}
function extensionFinish(){const x=mark(answers,'extension');return `<section class="question panel"><h1>Extension complete!</h1><p>You chose ${x.correct} of 5 hardware tools and ${x.reasons} of 5 matching reasons correctly.</p>${banner()}<button class="primary" data-action="save" ${busy?'disabled':''}>${busy?'Saving…':'Save extension results'}</button></section>`}
function teacherLogin(){return `<section class="panel" style="max-width:500px;margin:30px auto"><h1 style="font-size:35px">Teacher view</h1><p>View class results, assign links, and open or close the extension.</p><div class="field"><label for="pin">Teacher code</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"></div>${banner()}<div class="actions"><button class="primary" data-action="teacher-login" ${busy?'disabled':''}>${busy?'Opening…':'Open teacher view'}</button><button data-action="home">Back</button></div></section>`}
const classURL=c=>{const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('class',c);return u.href};
function csv(){const rows=[['Date','Class','Number','Label','Activity','Names correct /10','Tasks correct /3','Reasons correct /3','Extension choices /5','Extension reasons /5',...criteria]];for(const r of filteredResults()){rows.push([r.date,r.className,r.studentNumber,r.studentLabel,r.activity,r.scores.identify?.correct??'',r.scores.task?.correct??'',r.scores.task?.reasons??'',r.scores.extension?.correct??'',r.scores.extension?.reasons??'',...(r.self||[])]);}const safe=v=>{const s=String(v??'');return '"'+(/^[=+@\-]/.test(s)?"'":'')+s.replace(/"/g,'""')+'"'};const url=URL.createObjectURL(new Blob([rows.map(r=>r.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='hardware-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const filteredResults=()=>teacherData.results.filter(r=>!teacherClass||r.className===teacherClass);
function teacher(){const rs=filteredResults(),tc=teacherClass||config.classes[0];return `<div class="row"><div><span class="eyebrow">Ms. Kaple’s STEM</span><h1>Hardware lab results</h1></div><div class="actions"><button data-action="refresh-teacher">Refresh</button><button data-action="logout">Close teacher view</button></div></div><div class="actions">${['model','results','assign','settings'].map(t=>`<button data-action="teacher-tab" data-value="${t}" class="${teacherTab===t?'active':''}">${{model:'Model with class',results:'Student results',assign:'Class links & extension',settings:'Classes & numbers'}[t]}</button>`).join('')}</div>${banner()}${teacherTab==='model'?`<div class="panel"><h2>Model with the class</h2><p>Show one hardware-identification example and one task with a matching reason. This demonstration does not create a student result.</p><button class="primary" data-action="model">Open demonstration →</button></div>`:teacherTab==='results'?`<div class="panel"><div class="row"><h2>Results by homeroom</h2><button data-action="csv">Download CSV</button></div><div class="chips"><button class="chip ${!teacherClass?'active':''}" data-action="filter" data-value="">All classes</button>${config.classes.map(c=>`<button class="chip ${teacherClass===c?'active':''}" data-action="filter" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div><p class="muted">Scores use first answers. Practice is excluded. Reasons are selected explanations; use the closing share to hear students explain in their own words. Star ratings are student reports.</p><div class="results">${rs.length?rs.map(r=>`<details><summary>${esc(r.className)} · #${r.studentNumber}${r.studentLabel!==String(r.studentNumber)?' · '+esc(r.studentLabel):''} · ${r.activity==='main'?`Names ${r.scores.identify.correct}/10 · Tasks ${r.scores.task.correct}/3 · Reasons ${r.scores.task.reasons}/3`:`Extension ${r.scores.extension.correct}/5 · Reasons ${r.scores.extension.reasons}/5`}<br><small>${new Date(r.date).toLocaleString()}</small></summary>${r.self.length?`<p>${criteria.map((c,i)=>esc(c)+' '+ '⭐'.repeat(r.self[i])).join('<br>')}</p>`:''}<div class="tablewrap"><table><thead><tr><th>Question</th><th>Student answer</th><th>Correct hardware</th><th>Reason selected</th></tr></thead><tbody>${r.answers.map(a=>{const q=allQuestions.find(q=>q.id===a.id);return `<tr><td>${esc(q.phase)} · ${q.type==='identify'?'Identify '+name(q.answer):esc(q.prompt)}</td><td>${esc(name(a.choice))} ${a.choice===q.answer?'✓':'↻'}</td><td>${name(q.answer)}</td><td>${q.type==='task'?esc(q.reasons[a.reason])+(a.reason===q.reasonAnswer?' ✓':' ↻'):'—'}</td></tr>`}).join('')}</tbody></table></div></details>`).join(''):'<p>No saved results for this class yet.</p>'}</div></div>`:teacherTab==='assign'?`<div class="panel"><h2>Assign by homeroom</h2><p>Post each class’s link in Clever or Google Classroom. Students choose their number or name with buttons.</p><div class="links">${config.classes.map(c=>`<div class="linkrow"><b>${esc(c)}</b><input readonly value="${esc(classURL(c))}" aria-label="${esc(c)} activity link"><button data-action="copy" data-value="${esc(c)}">Copy link</button></div>`).join('')}</div></div><div class="panel"><h2>Extension access</h2><p>The main lesson is open. The extension opens only after a student saves the main lesson.</p><div class="actions"><button data-action="all-lock" data-value="open">Open for all classes</button><button data-action="all-lock" data-value="lock">Lock for all classes</button></div><div class="chips" style="margin-top:18px">${config.classes.map(c=>`<button class="chip" data-action="toggle-lock" data-value="${esc(c)}">${(config.classLocks?.[c]??config.extensionOpen)?'🔓':'🔒'} ${esc(c)}</button>`).join('')}</div></div>`:`<div class="panel"><h2>Classes and student numbers</h2><div class="grid2"><div class="field"><label for="classes">Homerooms — one per line</label><textarea id="classes">${esc(config.classes.join('\n'))}</textarea></div><div><div class="field"><label for="maxNumber">Largest student number (1–60)</label><input id="maxNumber" type="number" min="1" max="60" value="${config.maxNumber}"></div><p class="muted">Numbers are the default. Names are optional.</p></div></div><button class="primary" data-action="save-settings">Save classes and numbers</button></div><div class="panel"><h2>Optional names for one homeroom</h2><div class="chips">${config.classes.map(c=>`<button class="chip ${tc===c?'active':''}" data-action="roster-class" data-value="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="field"><label for="roster">${esc(tc)} — one name per numbered line; keep empty lines for unused numbers</label><textarea id="roster">${esc((config.rosters?.[tc]||[]).join('\n'))}</textarea></div><button class="primary" data-action="save-roster" data-value="${esc(tc)}">Save names</button></div>`}`}
function render(){const f={home,menu,question,reflection,done,extensionFinish,teacherLogin,teacher};$('app').className=screen==='menu'?'menu-page':'';$('app').innerHTML=(f[screen]||home)()}
function resetQuestion(){choice=null;reason=null;checked=false;error='';notice=''}
function start(){mode='main';stage='practice';index=0;answers=[];ratings=[0,0,0];mainSaved=false;extensionSaved=false;mainId='';resultId=uid();screen='question';resetQuestion();writeDraft();render();scrollTo(0,0)}
async function save(){if(busy)return;busy=true;error='';render();try{await api('POST',{action:'result',result:{id:resultId,activity:mode,className:student.className,studentNumber:student.number,answers,self:ratings,mainId}});if(mode==='main'){mainSaved=true;mainId=resultId}else extensionSaved=true;screen='done';writeDraft()}catch(e){error=e.message||'Could not save. Keep this page open and try again.'}finally{busy=false;render()}}
async function teacherLoad(){busy=true;error='';render();try{teacherData=await api('GET',null,true);config=teacherData.config;screen='teacher'}catch(e){error=e.message||'Could not open teacher view.'}finally{busy=false;render()}}
async function configSave(next){if(busy)return;busy=true;error='';try{await api('POST',{action:'config',config:next},true);config=next;notice='Saved.'}catch(e){error=e.message||'Could not save settings.'}finally{busy=false;render()}}
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value;notice='';error='';
if(a==='retry')return boot();
if(a==='class'){student={className:v,number:0};render()}
if(a==='student'){student.number=Number(v);render()}
if(a==='enter'){screen='menu';render();scrollTo(0,0)}
if(a==='menu'){screen='menu';render();scrollTo(0,0)}
if(a==='home'){student.number=0;screen='home';teacherCode='';render();scrollTo(0,0)}
if(a==='criteria')speak('Our goal: I can identify hardware and choose the best hardware for a task. I know I have got it when: '+criteria.join(' '));
if(a==='device'){const h=getHW(v);if($('menu-detail'))$('menu-detail').textContent=h.name+' — '+h.use;speak(h.name+'. '+h.use)}
if(a==='start')start();
if(a==='resume'){const d=readDraft();if(d){({mode,stage,index,answers,ratings,resultId,mainId,mainSaved,extensionSaved}=d);screen=d.screen==='menu'?(mainSaved?'done':'question'):d.screen;if(!['question','reflection','done','extensionFinish'].includes(screen))screen='question';resetQuestion();if(screen==='question'){const a=answers.find(a=>a.id===current().id);if(a){choice=a.choice;reason=a.reason;checked=true}}render();scrollTo(0,0)}}
if(a==='choice'){choice=v;reason=null;render()}
if(a==='reason'){reason=Number(v);render()}
if(a==='read'){const q=current();speak(q.prompt+' Choices: '+options(q).map(name).join('. '))}
if(a==='choice-read')speak(name(v));
if(a==='reason-read')speak(current().reasons[Number(v)]);
if(a==='reasons')speak('I would choose '+name(choice)+' because. '+current().reasons.join('. '));
if(a==='feedback')speak(feedback(current()));
if(a==='check'){const q=current();if(answers.some(x=>x.id===q.id))return;answers.push({id:q.id,choice,reason});checked=true;writeDraft();render()}
if(a==='next'&&stage==='model'){if(++index>=models.length){screen='teacher';notice='Demonstration finished. No student result was recorded.'}resetQuestion();render();scrollTo(0,0);return}
if(a==='next'){const n=stage==='practice'?practice.length:stage==='identify'?identification.length:stage==='task'?tasks.length:extension.length;if(++index>=n){index=0;if(stage==='practice')stage='identify';else if(stage==='identify')stage='task';else if(stage==='task')screen='reflection';else {screen='extensionFinish';writeDraft();return save()}}resetQuestion();writeDraft();render();scrollTo(0,0);$('question-title')?.focus()}
if(a==='rating'){const [i,n]=v.split(':').map(Number);ratings[i]=n;writeDraft();render()}
if(a==='save')return save();
if(a==='extension'){if(!mainSaved||!openExtension())return;mode='extension';stage='extension';index=0;answers=[];resultId=uid();screen='question';resetQuestion();writeDraft();render();scrollTo(0,0)}
if(a==='model'){stage='model';index=0;answers=[];screen='question';resetQuestion();render();scrollTo(0,0)}
if(a==='teacher'){screen='teacherLogin';render()}
if(a==='teacher-login'){teacherCode=$('pin').value;return teacherLoad()}
if(a==='refresh-teacher')return teacherLoad();
if(a==='logout'){teacherCode='';teacherData=null;screen='home';render()}
if(a==='teacher-tab'){teacherTab=v;render()}
if(a==='filter'||a==='roster-class'){teacherClass=v;render()}
if(a==='csv')csv();
if(a==='copy'){try{await navigator.clipboard.writeText(classURL(v));notice='Class link copied.'}catch{notice='Select and copy the class link above.'}render()}
if(a==='toggle-lock'){const next=structuredClone(config);next.classLocks[v]=!(next.classLocks[v]??next.extensionOpen);return configSave(next)}
if(a==='all-lock'){const next=structuredClone(config);next.extensionOpen=v==='open';next.classLocks={};return configSave(next)}
if(a==='save-settings'){const classes=$('classes').value.split('\n').map(x=>x.trim()).filter(Boolean),maxNumber=Number($('maxNumber').value);return configSave({...config,classes,maxNumber})}
if(a==='save-roster'){const next=structuredClone(config);next.rosters[v]=$('roster').value.split('\n');return configSave(next)}
});
setInterval(async()=>{if(!config||screen==='teacher'||screen==='teacherLogin')return;try{const c=await api();config=c;if(screen==='done')render()}catch{}},15000);
boot();
</script></body></html>
