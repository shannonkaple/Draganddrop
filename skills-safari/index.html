/* Safari mini-games — floating objects, collecting, timed hunts and double-click rescue. */
.tap-zone{position:absolute;top:72px;left:6%;right:6%;bottom:12px;z-index:5}
.tap-item{position:absolute;display:grid;place-items:center;width:clamp(62px,7.5vw,96px);height:clamp(62px,7.5vw,96px);font-size:clamp(34px,4.4vw,57px);line-height:1;transform:translate(-50%,-50%);border:3px solid #468458;border-radius:21px;background:#fffae9ec;box-shadow:0 5px 0 #8bb48d7a;touch-action:manipulation;transition:left .65s ease,top .65s ease}
.tap-item.float{animation:safari-float 1.8s ease-in-out infinite alternate}
.tap-item.fast{animation-duration:1.1s}
.tap-item.hit{background:#c4f6be;border-color:#58a663;pointer-events:none;animation:none;opacity:.65}
.tap-item.miss{background:#ffddd1;border-color:#d77c65}
.tap-item:disabled{pointer-events:none}
.tap-meter{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);z-index:8;background:#fff9dcf2;border:2px solid #7aab77;border-radius:50px;padding:6px 17px;display:flex;gap:16px;justify-content:center;font-size:clamp(14px,1.35vw,19px);white-space:nowrap}
.tap-clock.urgent{color:#bc4532;font-weight:bold}
.tap-again{position:absolute;z-index:25;inset:18% 22%;background:#fffbeb;border:4px solid #e4bc5d;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:12px;flex-direction:column;text-align:center;padding:15px;box-shadow:0 10px 40px #204c3966}
.tap-again h2{margin:0;font-size:28px}
.tap-again p{margin:0}
@keyframes safari-float{from{translate:-11px -8px;rotate:-5deg}to{translate:11px 10px;rotate:5deg}}
@media(max-width:720px){.tap-zone{left:2%;right:2%;top:65px}.tap-item{width:58px;height:58px;font-size:32px}.tap-again{inset:17% 5%}}
@media(prefers-reduced-motion:reduce){.tap-item.float{animation:none}}

async function reconnectSafariCloud(){
 if(!state.teacher||!state.number||state.preview||cloudReady)return;
 const teacher=state.teacher.id,student=state.number,session=cloudSession;
 updateCloudStatus('loading');
 try{
  const reply=await cloudRequest({action:'load',teacher,student});
  if(session!==cloudSession)return;

  mergeSafari(reply.progress,true);saveLocalSnapshot();
  cloudReady=true;

 }catch(e){if(session===cloudSession){updateCloudStatus('local');alert('Online storage is still unavailable. Local progress remains on this Chromebook.')}}
}

function queueCloudSave(){
 if(state.preview||!state.teacher||!state.number)return;
 if(!cloudReady){updateCloudStatus('local');return}
 cloudDirty=true;updateCloudStatus('saving');
 if(cloudBusy)return;
 cloudBusy=true;
 const session=cloudSession,teacher=state.teacher.id,student=state.number;
 (async()=>{
  try{
   while(cloudDirty&&session===cloudSession){
    cloudDirty=false;
    let payload=safariProgress();
    for(let attempt=0;attempt<4;attempt++){
     try{
      const reply=await cloudRequest({action:'save',teacher,student,revision:cloudRevision,progress:payload});
      if(session!==cloudSession)return;
      cloudRevision=reply.revision;
      break;
     }catch(e){
      if(session!==cloudSession)return;
      if(e.status!==409||attempt===3)throw e;
      const fresh=await cloudRequest({action:'load',teacher,student});
      if(session!==cloudSession)return;
      cloudRevision=fresh.revision;
      mergeSafari(fresh.progress,true);
      saveLocalSnapshot();payload=safariProgress();
      cloudDirty=true;
     }
    }
   }
   if(session===cloudSession)updateCloudStatus('saved');
  }catch(e){
   if(session===cloudSession){cloudReady=false;updateCloudStatus('local');console.error('Skills Safari cloud save:',e)}
  }finally{if(session===cloudSession){cloudBusy=false;if(cloudDirty&&cloudReady)queueCloudSave()}}
 })();
}

function safeStuff(){
 return {purchases:[],placed:[],backgrounds:{},world:0,character:'frog',ownedCharacters:['frog']};
}
function loadStuff(){
 state.stuff=safeStuff();state.stuffPending=null;
 if(state.preview||!state.teacher||!state.number)return;
 try{
  const raw=JSON.parse(localStorage.getItem(saveKey()+':my-stuff-v1')||'null');
  if(!raw||typeof raw!=='object')return;
  if(Array.isArray(raw.purchases))state.stuff.purchases=[...new Set(raw.purchases.filter(id=>SHOP_CATALOG.some(item=>item.id===id)))];
  if(Array.isArray(raw.placed))state.stuff.placed=raw.placed.filter(p=>p&&Number.isInteger(p.world)&&p.world>=0&&p.world<8&&typeof p.id==='string'&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&Number.isFinite(p.scale)).slice(0,200);
  if(raw.backgrounds&&typeof raw.backgrounds==='object')state.stuff.backgrounds=Object.fromEntries(
   Object.entries(raw.backgrounds).filter(([k,v])=>/^[0-7]$/.test(k)&&(v==='map'||/^scene:[0-7]$/.test(v)))
   .map(([k,v])=>[k,v==='map'?'scene:'+k:v]));
  if(Number.isInteger(raw.world)&&raw.world>=0&&raw.world<8)state.stuff.world=raw.world;
  const validCharacter=id=>SAFARI_CHARACTERS.some(c=>c.id===id);
  if(validCharacter(raw.character))state.stuff.character=raw.character;
  if(Array.isArray(raw.ownedCharacters)){
   state.stuff.ownedCharacters=[...new Set([
    ...raw.ownedCharacters.filter(validCharacter),state.stuff.character
   ])];
  }else state.stuff.ownedCharacters=[...new Set(['frog',state.stuff.character])];
 }catch(e){state.stuff=safeStuff()}
}
function persistStuff(){
 if(state.preview||!state.teacher||!state.number)return true;
 try{localStorage.setItem(saveKey()+':my-stuff-v1',JSON.stringify(state.stuff));queueCloudSave();return true}
 catch(e){alert('Your My Stuff could not save on this Chromebook. Please tell your teacher.');return false}
}

function promptBadge(text){
 // Internal handle: the visual prompt is displayed in the single guide strip.
 const b=el('div','question-bubble',text||'');document.getElementById('puzzle').append(b);return b;
}
function updateGuide(){
 const cmd=document.getElementById('guide-command'),img=document.getElementById('guide-picture');
 if(!cmd||!run||state.view!=='game')return;
 const type=run.type;
 let action='',target='',goal=1,value=0;
 if(type==='click'||type==='double'){
  const c=run.config;if(!c)return;
  goal=c.goal||1;value=run.taps||0;
  target=c.mode==='sequence'?run.clueOrder?.[value]:run.collectOrder?.[value]||(c.mode==='collect'?c.items?.[value%c.items.length]:c.icon);
  action=(type==='double'?'DOUBLE-CLICK ':'CLICK ')+(c.mode==='sequence'?'THIS':goal);
 }else if(type==='letter'||type==='number'){
  goal=run.keys?.length||1;value=run.step||0;
  const next=run.keys?.[value];
  target=run.spec?.kind==='count'?run.spec?.decor:next;
  action=run.spec?.kind==='count'?'COUNT → PRESS NUMBER':'FIND KEY';
 }else if(type==='arrows'){
  goal=run.checkpoints?.length||1;value=run.picked?.length||0;
  target=run.spec?.decor;action=run.selected?'ARROWS → CAMP':'CLICK JEEP → ARROWS';
 }else if(type==='selectmove'||type==='drag'){
  goal=run.pieces?.length||1;value=run.pieces?.filter(p=>p.done).length||0;
  target=run.pieces?.find(p=>!p.done)?.emoji;
  action=type==='drag'?'HOLD + DRAG '+goal:'CLICK → ARROWS '+goal;
 }else if(type==='scroll'){
  goal=run.spec?.targets?.length||1;value=run.scrollStep||0;
  target=run.spec?.targets?.[value]?.[0];action='TWO-FINGER SCROLL → FIND';
 }
 cmd.textContent=action||'PLAY';
 img.replaceChildren();
 if(target!==undefined&&target!==null&&target!=='')putAnimalArt(img,target);
 const progress=document.getElementById('guide-progress');
 if(progress)progress.textContent=value+' / '+goal;
 const timer=document.getElementById('guide-clock');
 if(timer)timer.textContent=Number.isFinite(run.secondsRemaining)?'⏱ '+Math.max(0,run.secondsRemaining)+'s':'';
}
function shuffled(values){const a=values.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const previousSafariClues=new Map();
function freshPromptOrder(values,key){
 const source=values.slice();
 if(source.length<2)return source;
 const previous=previousSafariClues.get(key);
 let result=shuffled(source),attempts=0;
 while(attempts++<16&&(result.join('|')===source.join('|')||result.join('|')===previous)){
  result=shuffled(source);
 }
 if(result.join('|')===source.join('|')||result.join('|')===previous){
  const shift=1+Math.floor(Math.random()*(source.length-1));
  result=source.slice(shift).concat(source.slice(0,shift));
 }
 previousSafariClues.set(key,result.join('|'));
 return result;
}
function animalChoices(want,stage,limit){
 // Include EVERY required target first, then add distractors. Never replace
 // a required target with another target (which made some levels impossible).
 const choices=[];
 for(const a of want)if(!choices.some(x=>x.name===a.name))choices.push(a);
 for(const a of shuffled(ANIMALS)){
  if(choices.length>=limit)break;
  if(!choices.some(x=>x.name===a.name))choices.push(a);
 }
 return shuffled(choices);
}

function startTapGame(type,stage,puzzle){
 const twice=type==='double',config=(twice?DOUBLE_GAMES:CLICK_GAMES)[stage],action=twice?'DOUBLE-CLICK':'CLICK';
 run.taps=0;run.active=true;run.config=config;
 run.clueOrder=config.mode==='sequence'?freshPromptOrder(config.order,'tap:'+type+':'+stage):null;
 run.collectOrder=config.mode==='collect'&&new Set(config.items).size>1?freshPromptOrder(config.items,'collect:'+type+':'+stage):null;
 const label=promptBadge(config.name.toUpperCase()+' · '+action);
 const zone=el('div','tap-zone');puzzle.append(zone);
 const meter=el('div','tap-meter'),count=el('span',''),timeLabel=el('span','tap-clock');
 meter.append(count,timeLabel);puzzle.append(meter);
 let time=config.seconds||0;
 const number=config.slots||config.items.length, buttons=[];
 function refresh(){
  count.textContent='⭐ '+run.taps+' / '+config.goal;
  timeLabel.textContent=config.seconds?'⏱ '+time+' SECONDS':'';
  timeLabel.classList.toggle('urgent',config.seconds&&time<=12);
  if(config.mode==='sequence')label.textContent=action+' '+(run.clueOrder[run.taps]||'DONE');
  else if(run.collectOrder)label.textContent=action+' '+(run.collectOrder[run.taps]||'DONE');
  run.secondsRemaining=config.seconds?time:null;updateGuide();
 }
 function icons(){
  if(config.mode==='collect')return shuffled(config.items);
  if(config.mode==='sequence'){
   const icons=Array.from(new Set(run.clueOrder.concat(config.other)));
   const extras=['🌴','🥥','🌸','🪵','🧭','🐾'];
   for(let i=0;icons.length<number&&i<extras.length;i++)if(!icons.includes(extras[i]))icons.push(extras[i]);
   return shuffled(icons);
  }
  return shuffled(Array.from({length:number},(_,i)=>i%3===1?config.other[Math.floor(i/3)%config.other.length]:config.icon));
 }
 function slot(b,i){
  b.style.left=(12+(i%4)*25)+'%';
  b.style.top=(15+Math.floor(i/4)*34)+'%';
  b.style.animationDelay=(-i*.36)+'s';
 }
 function push(b,symbol,i){
  if(!run||run.complete||!run.active||b.disabled||state.view!=='game')return;
  if(config.mode==='hunt'&&symbol!==config.icon||
     config.mode==='sequence'&&symbol!==run.clueOrder[run.taps]||
     run.collectOrder&&symbol!==run.collectOrder[run.taps]){
   b.classList.add('miss');
   feedback('Look for '+(run.clueOrder?run.clueOrder[run.taps]:run.collectOrder?run.collectOrder[run.taps]:config.icon)+'!',true);
   setTimeout(()=>b.classList.remove('miss'),330);return;
  }
  b.disabled=true;b.classList.add('hit');b.textContent='✨';run.taps++;refresh();
  // Allow the same picture to appear multiple times in a sequence mission.
  if(config.mode==='sequence')setTimeout(()=>{
   if(run&&run.active&&!run.complete&&state.view==='game'){
    b.disabled=false;b.classList.remove('hit');putAnimalArt(b,symbol);
   }
  },250);
  feedback('Great '+(twice?'double-click':'click')+'! ⭐ '+run.taps+' / '+config.goal);
  if(run.taps===config.goal){run.active=false;stopTapTimers();completeLevel();return}
  if(config.mode==='hunt'){
   setTimeout(()=>{
    if(!run||run.complete||!run.active||state.view!=='game')return;
    b.disabled=false;b.classList.remove('hit');putAnimalArt(b,symbol);
    const other=buttons[(i+run.taps*3)%buttons.length];
    if(other&&other!==b){
     const x=b.style.left,y=b.style.top;b.style.left=other.style.left;b.style.top=other.style.top;
     other.style.left=x;other.style.top=y;
    }
   },twice?750:420);
  }
 }
 const randomSlots=shuffled(Array.from({length:number},(_,i)=>i));
 icons().forEach((symbol,i)=>{
  const b=putAnimalArt(el('button','tap-item'),symbol);
  b.type='button';b.setAttribute('aria-label',action.toLowerCase()+' '+symbol);
  if(config.moving)b.classList.add('float');
  if(config.fast)b.classList.add('fast');
  slot(b,randomSlots[i]);b.addEventListener(twice?'dblclick':'click',e=>{if(twice&&e.detail<2)return;push(b,symbol,i)});
  zone.append(b);buttons.push(b);
 });
 refresh();
 if(config.moving){
  tapDrift=setInterval(()=>{
   if(!run||run.complete||!run.active||state.view!=='game')return;
   const available=buttons.filter(b=>!b.disabled);
   if(available.length<2)return;
   const idx=Math.floor(Math.random()*available.length);
   const a=available[idx],b=available[(idx+1+Math.floor(Math.random()*(available.length-1)))%available.length];if(a===b)return;
   const x=a.style.left,y=a.style.top;a.style.left=b.style.left;a.style.top=b.style.top;b.style.left=x;b.style.top=y;
  },3600);
 }
 if(config.seconds)tapClock=setInterval(()=>{
  if(!run||run.complete||state.view!=='game'){stopTapTimers();return}
  time--;refresh();if(time>0)return;
  run.active=false;stopTapTimers();
  const retry=el('div','tap-again');retry.append(el('h2','','TIME IS UP!'));
  retry.append(el('p','','You caught '+run.taps+' of '+config.goal+'. Try again!'));
  const button=el('button','','↻ TRY AGAIN');button.onclick=()=>setView('game');
  retry.append(button);puzzle.append(retry);
 },1000);
}

 {title:'Move Frog and Turtle to the Rafts',help:'Drag the frog and turtle onto the moving rafts!',icons:['🐸','🐢'],kind:'moving',moving:true},
 {title:'Fill the Picnic Basket',help:'Drag the coconut, apple, banana and pineapple into the picnic basket!',icons:['🥥','🍎','🍌','🍍'],kind:'basket',shared:true},
 {title:'Deliver Backpack, Fish and Compass',help:'Drag the backpack, fish and compass to their matching pictures!',icons:['🎒','🐟','🧭'],kind:'race',seconds:85},
 {title:'Rescue the Otter',help:'RESCUE THE OTTER! DRAG FOUR river supplies into their matching spots!',icons:['🐟','🦀','🪣','🐚'],kind:'rescue',seconds:115}
];
function startMoveGame(type,stage,puzzle){
 const dragging=type==='drag',spec=(dragging?DRAG_GAMES:SELECT_GAMES)[stage];
 run.active=true;run.spec=spec;run.selected=null;
 run.beacons=[];
 const zone=el('div','move-zone');run.zone=zone;puzzle.append(zone);
 const count=spec.icons.length;
 const ys=count===1?[42]:count===2?[23,60]:count===3?[12,40,68]:[6,30,54,77];
 const goalYs=spec.reverse?ys.slice().reverse():ys.slice();
 const height=count===4?19:22;
 run.pieces=spec.icons.map((icon,i)=>({
  id:i,emoji:icon,x:11+(i%2)*5,y:ys[i],w:15,h:height,tx:spec.shared?67:71+(i%2)*2,ty:spec.shared?39:goalYs[i],done:false
 }));
 run.badge=promptBadge(spec.title.toUpperCase()+' · '+(dragging?'DRAG & DROP':'SELECT + ARROWS'));
 if(spec.shared){
  const t=putAnimalArt(el('div','target basket'),'🧺');t.style.left='66%';t.style.top='37%';t.style.width='20%';t.style.height='28%';zone.append(t);run.sharedTarget=t;
 }else{
  run.pieces.forEach((p,i)=>{
   const t=el('div','target');t.style.left=p.tx+'%';t.style.top=p.ty+'%';t.style.width=p.w+'%';t.style.height=p.h+'%';t.append(safariArt(p.emoji,'ghost'));
   if(!dragging)t.append(el('span','animal-name-tag','HOME'));
   if(spec.moving)t.classList.add('raft');
   zone.append(t);p.goalEl=t;
  });
 }
 if(spec.beacons){
  spec.beacons.forEach(([x,y],i)=>{
   const b=el('div','move-beacon',i%2?'🏅':'⭐');b.style.left=x+'%';b.style.top=y+'%';
   run.beacons.push({x,y,got:false,element:b});zone.append(b)
  });
 }
 if(spec.decoys){
  spec.decoys.forEach((icon,i)=>{
   const d=putAnimalArt(el('div','draggy'),icon);d.style.left=(34+i*20)+'%';d.style.top=(i%2?20:66)+'%';
   d.style.width='13%';d.style.height='20%';d.style.zIndex='3';zone.append(d);
   d.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;feedback('Find the ZEBRA instead!',true)});
  });
 }
 run.pieces.forEach(p=>{
  const item=putAnimalArt(el('div','draggy'),p.emoji);item.dataset.id=p.id;zone.append(item);p.element=item;positionPiece(p);
  if(dragging)item.addEventListener('pointerdown',e=>dragStart(e,p));
  else{
   item.classList.add('safari-selectable');
   item.append(el('span','animal-name-tag',ANIMALS.find(a=>a.icon===p.emoji)?.name?.toUpperCase()||'SELECT'));
   item.tabIndex=0;item.setAttribute('role','button');
   item.setAttribute('aria-label','Select '+(ANIMALS.find(a=>a.icon===p.emoji)?.name||'animal')+' and use keyboard arrows to move it');
   const selectPiece=()=>{
    if(!run||run.complete||run.active===false||p.done||state.view!=='game')return;
    run.selected=p;zone.querySelectorAll('.draggy').forEach(x=>x.classList.remove('selected'));
    item.classList.add('selected');
    run.badge.textContent='SELECTED '+p.emoji+' · USE THE KEYBOARD ARROWS';
    feedback('Animal selected! Press the ARROW KEYS to move it toward HOME.');
    document.getElementById('game-board')?.focus({preventScroll:true});
   };
   item.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;e.preventDefault();selectPiece()});
   item.addEventListener('click',e=>{if(e.detail===0)selectPiece()});
   item.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectPiece()}});
  }
 });
 if(spec.seconds)showMissionClock(spec.seconds);
}
function checkMoveCheckpoints(p){
 if(!run?.beacons?.length)return;
 const cx=p.x+p.w/2,cy=p.y+p.h/2;
 for(const b of run.beacons){
  if(!b.got&&Math.abs(cx-(b.x+4))<7&&Math.abs(cy-(b.y+6))<9){
   b.got=true;b.element.classList.add('picked');b.element.textContent='✅';
   feedback('Checkpoint collected! ⭐');
  }
 }
}
function verifyMoveDock(p){
 const ready=!run.beacons.length||run.beacons.every(b=>b.got);
 const centerX=p.x+p.w/2,centerY=p.y+p.h/2;
 const goalX=p.tx+p.w/2,goalY=p.ty+p.h/2;
 if(Math.abs(centerX-goalX)>6||Math.abs(centerY-goalY)>9)return;
 if(!ready){feedback('Collect the glowing checkpoints first!',true);return}
 p.x=p.tx;p.y=p.ty;p.done=true;p.element.classList.remove('selected');p.element.classList.add('done');positionPiece(p);run.selected=null;
 feedback('Animal rescued! ⭐');
 if(run.pieces.every(item=>item.done))completeLevel();
}
function targetPosition(p){
 const t=run.sharedTarget||p.goalEl;
 if(!t)return {x:p.tx,y:p.ty,w:p.w,h:p.h};
 const zone=run.zone.getBoundingClientRect(),r=t.getBoundingClientRect();
 return {x:(r.left-zone.left)/zone.width*100,y:(r.top-zone.top)/zone.height*100,w:r.width/zone.width*100,h:r.height/zone.height*100};
}


const SCROLL_GAMES=[
 {title:'Find the Hidden Lion',help:'Use two fingers to scroll down and find the lion!',total:12,targets:[['🦁',5]]},
 {title:'River Animal Search',help:'SCROLL down the list to find the OTTER, then find the FISH!',total:15,targets:[['🦦',6],['🐟',11]]},
 {title:'Fruit Trail Finder',help:'SCROLL down and find BANANA, COCONUT, and PINEAPPLE in order!',total:19,targets:[['🍌',5],['🥥',10],['🍍',15]]},
 {title:'Find Paw Print, Binoculars and Map',help:'Scroll down and find the paw print, binoculars and safari map!',total:20,targets:[['🐾',5],['BINOCULARS',11],['🗺️',16]]},
 {title:'Up and Down Safari',help:'SCROLL DOWN for a STAR, back UP for a COMPASS, then DOWN for a GEM!',total:22,targets:[['⭐',16],['🧭',1],['💎',19]]},
 {title:'Ranger Supply Search',help:'SCROLL down the supply list to find FOUR lost safari supplies!',total:25,targets:[['⛺',5],['🪣',11],['📷',17],['🎒',22]]},
 {title:'Scroll Scavenger Sprint',help:'FIND FIVE hidden pictures by SCROLLING before the timer runs out!',total:27,targets:[['🦋',5],['🐒',10],['🐘',15],['🦒',20],['🪶',24]],seconds:90},
 {title:'Rescue the Lion',help:'Find the medal, lion, key, butterfly, compass and star. Scroll up and down!',total:30,targets:[['🏅',5],['🦁',12],['🔑',18],['🦋',24],['🧭',2],['⭐',28]],seconds:120}
];
function startScrollGame(stage,puzzle){
 const spec=SCROLL_GAMES[stage];
 run.active=true;run.spec=spec;run.scrollStep=0;
 run.badge=promptBadge(spec.title.toUpperCase()+' · SCROLL TO FIND '+spec.targets[0][0]);
 const pane=el('div','scroll-case');run.scrollPane=pane;
 const filler=shuffled(['🌿','🍃','🌼','🌻','🌴','🍄','🪵','🌱','🍀','🪨','🌸','🐞','💮','🌹','🍁','☁️','🌾','🍂']);
 const goalIndex=new Map(spec.targets.map(([icon,row],i)=>[row,{icon,step:i}]));
 for(let i=0;i<spec.total;i++){
  const goal=goalIndex.get(i),symbol=goal?.icon||filler[i%filler.length];
  const b=el('button','scroll-item');b.type='button';b.dataset.row=i;
  b.append(safariArt(symbol));
  b.setAttribute('aria-label','Safari picture '+(i+1));
  if(goal)b.classList.add('scroll-target-picture');
  b.onclick=()=>{
   if(!run||run.complete||run.active===false||state.view!=='game')return;
   const next=spec.targets[run.scrollStep];
   if(!goal||goal.step!==run.scrollStep){
    feedback('Find the picture shown above. Keep scrolling!',true);return
   }
   if(i>3&&pane.scrollTop<25){feedback('Scroll down with TWO fingers first!',true);return}
   b.disabled=true;b.classList.add('found');b.append(el('span','scroll-found-icon','⭐'));
   run.scrollStep++;feedback('Found it! ⭐');
   if(run.scrollStep===spec.targets.length){completeLevel();return}
   run.badge.textContent='SCROLL TO FIND '+spec.targets[run.scrollStep][0]+' · '+spec.title.toUpperCase();
   updateScrollProgress()
  };
  pane.append(b)
 }
 puzzle.append(pane);
 const hud=el('div','scroll-score','FIND 0 / '+spec.targets.length);run.scrollHud=hud;puzzle.append(hud);
 function updateScrollProgress(){hud.textContent='FIND '+run.scrollStep+' / '+spec.targets.length;updateGuide()}
 if(spec.seconds)showMissionClock(spec.seconds);
}

function setupPuzzle(){
 const w=WORLDS[state.world],s=state.stage,puzzle=document.getElementById('puzzle');
 run={type:w.type,stage:s,step:0,complete:false};
 if(w.type==='click'||w.type==='double'){startTapGame(w.type,s,puzzle);return}
 if(w.type==='letter'||w.type==='number'){startKeyGame(w.type,s,puzzle);return}
 if(w.type==='arrows'){startArrowGame(s,puzzle);return}
 if(w.type==='selectmove'||w.type==='drag'){startMoveGame(w.type,s,puzzle);return}
 if(w.type==='scroll'){startScrollGame(s,puzzle);return}
}
function positionPiece(p){p.element.style.left=p.x+'%';p.element.style.top=p.y+'%';p.element.style.width=p.w+'%';p.element.style.height=p.h+'%'}
function paintMaze(){
 const grid=run.grid;grid.replaceChildren();
 for(let y=0;y<5;y++)for(let x=0;x<8;x++){
  const cell=el('div','maze-cell'),pickedIndex=run.checkpoints.findIndex((p,i)=>p[0]===x&&p[1]===y&&!run.picked.includes(i));
  if(run.rocks.some(p=>p[0]===x&&p[1]===y)){cell.classList.add('rock');cell.textContent='🪨'}
  else if(run.position[0]===x&&run.position[1]===y){
   cell.classList.add('player');if(run.selected)cell.classList.add('chosen');putAnimalArt(cell,'🚙');
   cell.onclick=()=>{run.selected=true;feedback('Now use the keyboard ARROW keys!');paintMaze();document.getElementById('game-board').focus({preventScroll:true})};
  }
  else if(pickedIndex>=0){cell.classList.add('arrow-pickup');putAnimalArt(cell,run.spec.decor)}
  else if(run.goal[0]===x&&run.goal[1]===y){cell.classList.add('goal');putAnimalArt(cell,'⛺')}
  grid.append(cell);
 }
 const remaining=run.checkpoints.length-run.picked.length;
 run.arrowHint.textContent=remaining?'Collect '+remaining+' more '+run.spec.decor+' before camp ⛺.':'All supplies collected! Drive to camp ⛺!';updateGuide();
}
function dragStart(e,p){
 if(e.pointerType==='touch'||!run||run.complete||run.active===false||p.done)return;
 e.preventDefault();
 const zone=run.zone,rect=zone.getBoundingClientRect();p.element.classList.add('selected');
 const x0=e.clientX,y0=e.clientY,ox=p.x,oy=p.y;
 const onMove=ev=>{
  if(run.active===false)return;
  p.x=clamp(ox+(ev.clientX-x0)/rect.width*100,0,100-p.w);
  p.y=clamp(oy+(ev.clientY-y0)/rect.height*100,0,100-p.h);positionPiece(p)
 };
 const onUp=()=>{
  p.element.removeEventListener('pointermove',onMove);
  p.element.removeEventListener('pointerup',onUp);
  p.element.removeEventListener('pointercancel',onUp);
  p.element.classList.remove('selected');
  if(run.active===false)return;
  const t=targetPosition(p);
  const cx=p.x+p.w/2,cy=p.y+p.h/2,tx=t.x+t.w/2,ty=t.y+t.h/2;
  const success=run.spec.shared?
    Math.abs(cx-tx)<t.w/2+2&&Math.abs(cy-ty)<t.h/2+3:
    Math.abs(cx-tx)<10&&Math.abs(cy-ty)<12;
  if(!success){feedback('Keep holding as you slide, then let go INSIDE the destination.',true);return}
  p.done=true;p.element.classList.add('done');
  if(run.spec.shared){p.element.style.display='none'}
  else{p.x=t.x;p.y=t.y;positionPiece(p)}
  feedback('Great drag and drop! '+run.pieces.filter(x=>x.done).length+' / '+run.pieces.length+' ⭐');
  if(run.pieces.every(item=>item.done))completeLevel()
 };
 p.element.addEventListener('pointermove',onMove);
 p.element.addEventListener('pointerup',onUp);
 p.element.addEventListener('pointercancel',onUp);
 try{p.element.setPointerCapture(e.pointerId)}catch(err){}
}
function completeLevel(){
 if(!run||run.complete)return;
 stopTapTimers();
 run.complete=true;run.active=false;
 const world=state.world,stage=state.stage,firstTime=!done(world,stage);
 if(!state.preview&&firstTime){
  state.done.push(world*8+stage);state.done.sort((a,b)=>a-b);
  if(!persist()){
   state.done=state.done.filter(id=>id!==world*8+stage);
   run.complete=false;run.active=true;
   feedback('Your work could not save. Ask your teacher for help.',true);return;
  }
 }
 feedback('LEVEL '+(stage+1)+' COMPLETE! '+(state.preview?'PREVIEW':firstTime?'STAR EARNED!':'PRACTICE COMPLETE!'));
 advanceTimer=setTimeout(()=>{
  if(state.view!=='game'||state.world!==world||state.stage!==stage)return;
  if(stage===7)showRescue();else showLevelComplete(world,stage,firstTime);
 },420);
}
function showLevelComplete(world,stage,firstTime){
 if(document.querySelector('.modal'))return;
 const modal=el('div','modal'),box=el('div','modal-card');
 box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');
 box.append(el('h2','','LEVEL '+(stage+1)+' COMPLETE!'));
 box.append(shopImage('./assets/pieces/gold-star.png','Safari gold star','level-success-star'));
 box.append(el('p','',state.preview?'TEACHER PREVIEW — NO STARS SAVED':firstTime?'YOU EARNED A STAR! KEEP EXPLORING!':'GREAT PRACTICE! YOUR STAR IS SAFE.'));
 box.append(listenButton(screenNarration,'Hear level completion'));
 const next=el('button','continue-safari','NEXT LEVEL '+(stage+2)+' ▶');
 next.onclick=()=>{modal.remove();state.stage=stage+1;setView('game')};
 box.append(next);
 const map=el('button','','BACK TO WORLD MAP');map.onclick=()=>{modal.remove();setView('world')};box.append(map);
 modal.append(box);document.body.append(modal);
}
function showRescue(){
 if(document.querySelector('.modal'))return;
 const w=WORLDS[state.world],modal=el('div','modal'),box=el('div','modal-card');
 box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');
 box.append(safariArt(w.friendIcon,'friend',w.friend));
 box.append(el('h2','','WORLD COMPLETE!'));
 const unlockedExtras=safariExtrasUnlocked();
 box.append(el('p','',state.preview?'TEACHER PREVIEW — NO STARS SAVED':
  unlockedExtras?'YOU RESCUED '+w.friend.toUpperCase()+'! ALL 64 LEVELS COMPLETE! YOUR STAR SHOP AND MY STUFF ARE UNLOCKED!':
  'YOU RESCUED '+w.friend.toUpperCase()+'! +10 STARS! KEEP EXPLORING!'));
 box.append(listenButton(screenNarration,'Hear rescue celebration'));
 if(unlockedExtras){
  const mine=el('button','continue-safari','🎒 MY STUFF');
  mine.onclick=()=>{modal.remove();state.stuff.world=state.world;state.stuffPending=null;setView('stuff')};box.append(mine);
  const shop=el('button','','⭐ STAR SHOP');
  shop.onclick=()=>{modal.remove();setView('shop')};box.append(shop);
 }
 const home=el('button','',unlockedExtras?'BACK TO SAFARI MAP':'NEXT SAFARI WORLD ▶');
 home.onclick=()=>{modal.remove();setView('home')};box.append(home);
 modal.append(box);document.body.append(modal);
}
function showFriends(){
 const modal=el('div','modal'),box=el('div','modal-card');box.append(el('h2','','MY SAFARI FRIENDS'));
 const gallery=el('div','friends-gallery'),completed=WORLDS.filter((w,i)=>count(i)===8);
 if(!completed.length)gallery.append(el('div','friend','🐾'));
 completed.forEach(w=>{const tile=el('div','friend-tile');tile.append(safariArt(w.friendIcon,'',w.friend),el('span','',w.friend));gallery.append(tile)});
 box.append(gallery);
 box.append(el('p','','Rescue a new friend at challenge 8 of each safari region.'));
 box.append(listenButton(screenNarration,'Hear friends information'));
 const close=el('button','','Close');close.onclick=()=>modal.remove();box.append(close);modal.append(box);document.body.append(modal)
}
window.addEventListener('keydown',e=>{
 if(state.view!=='game'||!run||run.complete||!['letter','number','arrows','selectmove'].includes(run.type))return;
 if(run.type==='letter'||run.type==='number'){
  if(run.active===false)return;
  const expected=run.keys[run.step];let input=e.key;
  if(run.type==='letter')input=input.toUpperCase();
  if(input.length!==1)return;
  e.preventDefault();if(e.repeat)return;
  if(input!==expected){feedback('Find '+expected+' on your real Chromebook keyboard!',true);return}
  run.step++;feedback('Nice key find! ⭐ '+run.step+' / '+run.keys.length);
  if(run.step>=run.keys.length)completeLevel();else updateKeyGame();
  return
 }
 const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
 if(!d)return;
 e.preventDefault();
 if(run.type==='arrows'){
  if(run.active===false)return;
  if(!run.selected){feedback('Click the jeep FIRST, then use the keyboard arrows.',true);return}
  const x=run.position[0]+d[0],y=run.position[1]+d[1];
  if(x<0||y<0||x>=8||y>=5||run.rocks.some(p=>p[0]===x&&p[1]===y)){feedback('Rock or edge! Try another arrow.',true);return}
  run.position=[x,y];
  run.checkpoints.forEach((p,i)=>{if(p[0]===x&&p[1]===y&&!run.picked.includes(i)){run.picked.push(i);feedback('Collected '+run.spec.decor+'! ⭐')}});
  paintMaze();
  if(x===run.goal[0]&&y===run.goal[1]){
   if(run.picked.length===run.checkpoints.length)completeLevel();
   else feedback('Collect all '+run.spec.decor+' before finishing!',true);
  }
  return
 }
 if(run.type==='selectmove'){
  if(run.active===false)return;
  const p=run.selected;if(!p||p.done){feedback('CLICK an unfinished animal first!',true);return}
  const beforeX=p.x,beforeY=p.y;
  p.x=clamp(p.x+d[0]*4,0,100-p.w);p.y=clamp(p.y+d[1]*4,0,100-p.h);
  // Do not allow unfinished selectable animals to cover a finished one.
  const collide=run.pieces.some(q=>q!==p&&q.done&&
   Math.max(0,Math.min(p.x+p.w,q.x+q.w)-Math.max(p.x,q.x))*
   Math.max(0,Math.min(p.y+p.h,q.y+q.h)-Math.max(p.y,q.y))>2);
  if(collide){p.x=beforeX;p.y=beforeY;feedback('That spot is filled! Steer around it.',true)}
  else if(p.x!==beforeX||p.y!==beforeY)feedback('Nice moving! Keep going toward the matching HOME picture.');
  positionPiece(p);checkMoveCheckpoints(p);verifyMoveDock(p);
  return
 }
});
render();
</script>
