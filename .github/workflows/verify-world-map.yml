name: Verify Eight World Map
on:
  push:
    branches: [main]
    paths:
      - 'trackpad-adventure/maps/*.jpg'
      - 'trackpad-adventure/campaign.mjs'
      - 'trackpad-adventure/game.mjs'
      - 'trackpad-adventure/arrow-home.css'
      - 'trackpad-adventure.html'
      - 'trackpad-adventure/test-map.mjs'
      - '.github/workflows/verify-world-map.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check Sharp JPEG, World Alignment, Locks, and Play
        run: node trackpad-adventure/test-map.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Corrected-Trackpad-World-Map
          path: trackpad-adventure/preview-fixed-map.png
          retention-days: 15
