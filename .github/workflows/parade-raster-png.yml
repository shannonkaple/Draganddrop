name: Build actual PNG parade UI assets
on:
  push:
    branches: [main]
    paths:
      - 'thanksgiving-parade/build-final-png.py'
      - '.github/workflows/parade-raster-png.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-png:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: pip install Pillow==11.3.0
      - name: Load parade-style display font for rasterization only
        continue-on-error: true
        run: |
          curl -fL --connect-timeout 5 --max-time 20 -o /tmp/kaple-parade-Rye.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/rye/Rye-Regular.ttf
      - name: Render final PNG picture assets
        run: python thanksgiving-parade/build-final-png.py
      - name: Commit finished raster artwork
        run: |
          git config user.name "parade-art-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thanksgiving-parade/assets/ui/final-png-20261117/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish matching parade artwork as real PNG files [skip ci]"
            git push origin HEAD:main
          fi
