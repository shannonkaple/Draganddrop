name: Verify click/move/resize/rotate touch lock
on:
  push:
    branches: [main]
    paths:
      - click-move-resize-rotate/index.html
      - click-move-resize-rotate/tests/touch-input.test.mjs
      - .github/workflows/cmr-touch-guard.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  touch-input:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test all ten levels, touch suppression, and normal trackpad operation
        run: node --test click-move-resize-rotate/tests/touch-input.test.mjs
