name: Parade Chromebook Layout QA
on:
  push:
    branches: [balloon-maker-development]
    paths:
      - thanksgiving-parade/**
      - .github/workflows/parade-chromebook-qa.yml
  workflow_dispatch:
jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local website and test Chromebook viewports
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/parade-server.log 2>&1 &
          sleep 2
          node thanksgiving-parade/tests/chromebook-viewport.test.mjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parade-chromebook-screenshots
          path: thanksgiving-parade/tests/screenshots/
          if-no-files-found: ignore
