name: Verify Arrow-Naut automatic cloud saves
on:
  push:
    branches: [main]
    paths:
      - 'arrow-naut/cloud-save.mjs'
      - 'arrow-naut/cloud-save.test.mjs'
      - 'arrow-naut/app.mjs'
      - 'arrow-naut-jr/app.mjs'
      - '.github/workflows/arrownaut-cloud-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arrownaut-cloud-smoke
  cancel-in-progress: true
jobs:
  verify-auto-saves:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check automatic cloud client syntax
        run: node --check arrow-naut/cloud-save.mjs
      - name: Test automatic progress sync across Chromebooks
        run: node --test arrow-naut/cloud-save.test.mjs
      - name: Check live cloud API using synthetic class 99 only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const url='https://vcjyhcnsuiwdeqqbiwgx.supabase.co/functions/v1/arrownaut-save';
          const scope={game:'naut',teacher:'class-99',student:30};
          const send=async data=>{
            const response=await fetch(url,{method:'POST',headers:{
              'Content-Type':'application/json','Origin':'https://shannonkaple.github.io'
            },body:JSON.stringify(data)});
            return {status:response.status,body:await response.json()};
          };
          const initial=await send({...scope,action:'load'});
          assert.equal(initial.status,200,JSON.stringify(initial));
          const prior=initial.body.progress||{version:1,completed:[],purchases:[],rescued:[],stars:0};
          const upgraded={...prior,
            completed:[...new Set([...prior.completed,'synthetic-autosave-20261109'])],
            teacherUnlockThrough:Math.max(prior.teacherUnlockThrough||-1,74),
            teacherTarget:{map:'two',world:1,stage:2},
            stars:Math.max(prior.stars||0,3),
            purchases:prior.purchases||[],rescued:prior.rescued||[]};
          const saved=await send({...scope,action:'save',
            revision:initial.body.revision,progress:upgraded});
          assert.equal(saved.status,200,JSON.stringify(saved));
          const reloaded=await send({...scope,action:'load'});
          assert.equal(reloaded.status,200,JSON.stringify(reloaded));
          assert.deepEqual(reloaded.body.progress,upgraded);
          assert.equal(reloaded.body.revision,saved.body.revision);
          const stale=await send({...scope,action:'save',
            revision:initial.body.revision,progress:upgraded});
          assert.equal(stale.status,409,'Stale Chromebooks may not overwrite newer records');
          const invalid=await send({...scope,student:31,action:'load'});
          assert.equal(invalid.status,400,'Student numbers outside 1-30 are invalid');
          console.log('PASS: no-code load, save, re-open, revision safety and student-number checks');
          NODE
