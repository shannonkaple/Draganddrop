name: Install original standalone Arrow-Naut PNG art
on:
  push:
    paths:
      - '.github/workflows/install-arrownaut-puzzle-art.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PNG pieces into both games
