name: Update Cute Trackpad World Map
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-cute-trackpad-map.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - run: python trackpad-adventure/import-cute-background.py
      - name: Save cute JPG permanently in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trackpad-adventure/maps/overview.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Use illustrated cute eight-island backdrop [skip ci]"
            git push origin HEAD:main
          fi
