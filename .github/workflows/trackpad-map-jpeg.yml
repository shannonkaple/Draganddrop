name: Build Trackpad Home JPEG
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trackpad-map-jpeg.yml'
      - 'trackpad-adventure/maps/overview.svg'
      - 'trackpad-adventure/render-map-jpeg.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-map:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser renderer
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Convert map SVG to matching 1600x690 JPEG
        run: node trackpad-adventure/render-map-jpeg.cjs
      - name: Commit generated JPEG to the game repository
        run: |
          git config user.name "trackpad-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trackpad-adventure/maps/overview.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Update Trackpad home map JPEG [skip ci]"
            git push origin HEAD:main
          fi
