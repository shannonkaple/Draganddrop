name: Render Matching World Maps
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-eight-world-maps.yml'
      - 'trackpad-adventure/build-eight-world-maps.py'
      - 'arrow-lab/scenes/**'
      - 'arrow-lab/candy-stages/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python trackpad-adventure/build-eight-world-maps.py
      - name: Publish JPEGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trackpad-adventure/maps/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Update matching blank-circle world JPGs"
            git push origin HEAD:main
          fi
