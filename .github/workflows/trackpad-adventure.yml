name: Check Second Grade Trackpad Adventure
on:
  push:
    branches: [main, arrow-adventure-expansion]
    paths:
      - 'game-ui/**'
      - 'trackpad-adventure.html'
      - 'trackpad-adventure/**'
      - '.github/workflows/trackpad-adventure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node trackpad-adventure/test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Trackpad-Adventure-Preview
          path: trackpad-adventure/preview.png
