name: Verify Arrow-Naut classroom levels

on:
  push:
    branches: [main]
    paths:
      - 'arrow-naut/**'
      - 'arrow-naut-jr/**'
      - '.github/workflows/arrownaut-classroom-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arrownaut-classroom-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-classroom-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test 64 second-grade missions, including complete routes and rescues
        run: node --test arrow-naut/solvability.test.mjs
      - name: Test 64 first-grade missions and keyboard-only controls
        run: node --test arrow-naut-jr/routes.test.mjs
      - name: Verify each student's own explorer can be placed, resized and replaced in both games
        run: node --test arrow-naut/my-stuff-avatar.test.mjs
      - name: Test all 16 implemented Map Two missions and saved progress
        run: node --test arrow-naut/map-two.test.mjs
      - name: Validate 144 levels, enemy spawns, pictures, and map references
        run: node --test arrow-naut/classroom-playability.test.mjs
