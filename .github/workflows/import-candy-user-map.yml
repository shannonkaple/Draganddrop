name: Import Uploaded Candy Map Original
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-candy-user-map.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - run: python trackpad-adventure/import-candy-user-map.py
      - name: Commit map if full resolution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trackpad-adventure/maps/candy-original-upload.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Import exact user-uploaded 2048px Candy map [skip ci]"
            git push origin HEAD:main
          fi
