function partArt(label){const p=partInfo[label];return p?'<svg viewBox="0 0 100 72" aria-hidden="true" fill="none" stroke="#2d4474" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">'+p.svg+'</svg>':'<span class="custompart">'+esc(label)+'</span>'}
function initBoard(){const g=game,count=5,offset=0;g.boardParts=Array.from({length:count},(_,i)=>({id:i,label:g.activity.items[(i+offset)%6],attempts:0,firstRelease:false,incorrectDrops:0,x:22,y:55+i*90}));g.boardChecks=0;}
function showGame(){view='game';const g=game,isCheck=g.phase==='check';if(!g.boardParts)initBoard();const parts=g.boardParts,order=isCheck?(g.activity.theme==='space'?[3,0,4,1,2]:[2,4,0,3,1]):[4,1,3,0,2];app.innerHTML=`<div class="gametop"><div><span class="eyebrow">${esc(g.activity.title)}</span><h2 style="margin-top:9px">${isCheck?'Five practicals. Your turn!':'Practice five computer parts.'}</h2></div><span class="badge">${esc(className)} · Student ${student}</span></div><div class="sectionline"><span>${isCheck?'Practical · 5 parts':'Practice · 5 parts'} · Move them in any order</span><button class="read" id="read">◖)) Hear the steps</button></div><p class="note">${g.activity.theme==='space'?'Match each picture to what that part does.':'Match each computer part to its name.'} You can move every card anywhere on the board and pick it up again.</p><div class="boardwrap"><div class="board reviewboard ${g.activity.theme==='space'?'spaceboard':''}" id="board"><div class="boardlabel">Both hands · Click and hold · Drag · Lift both to drop</div>${parts.map(p=>`<div class="target partslot" id="target-${p.id}" data-for="${p.id}"><b>${esc(g.activity.theme==='space'?(partInfo[p.label]?.clue||p.label):p.label)}</b><button class="hearlabel" data-hear="${p.id}" aria-label="Read this destination">◖))</button><small>Drop the matching picture</small></div>`).join('')}${parts.map(p=>`<div class="token part" id="token-${p.id}" role="img" aria-label="${esc(p.label)} picture. Drag with your trackpad.">${partArt(p.label)}${g.activity.theme==='space'?'':`<span>${esc(p.label)}</span>`}</div>`).join('')}</div></div><div class="hint" id="hint" aria-live="polite">Move a part. Let go. Pick it up again if you want to change its place.</div><div class="gamefooter"><button class="quiet" id="back">Leave review</button><button class="quiet" id="helpFinish">Finish with help needed</button><button class="primary" id="checkBoard">Check my board ✓</button></div>`;
$('#read').onclick=readCriteria;$('#back').onclick=()=>{if(confirm('Leave this board? Unfinished work will not be saved.'))home()};$('#helpFinish').onclick=()=>{if(confirm('Finish this board with the parts where they are? Your teacher will see which parts still need help.'))finishBoard()};$('#checkBoard').onclick=()=>{g.boardChecks++;const correct=parts.filter(p=>isPartCorrect(p)).length;parts.forEach(p=>$('#token-'+p.id).classList.toggle('placed',isPartCorrect(p)));if(correct===parts.length)finishBoard();else $('#hint').textContent=`${correct} of ${parts.length} parts match. Move any card to try again, or choose “Finish with help needed.”`;};
const board=$('#board'),rect=board.getBoundingClientRect();const slots=[[.34,65],[.72,65],[.4,350],[.72,350],[.34,210]];
for(const p of parts){const target=$('#target-'+p.id),token=$('#token-'+p.id),slot=slots[order[p.id]];target.style.left=Math.min(rect.width-target.offsetWidth-20,rect.width*slot[0])+'px';target.style.top=slot[1]+'px';token.style.left=p.x+'px';token.style.top=p.y+'px';token.onpointerdown=e=>{if(!validMouse(e)||g.drag||g.paused)return;e.preventDefault();const r=board.getBoundingClientRect();g.drag={id:e.pointerId,part:p.id,dx:e.clientX-r.left-p.x,dy:e.clientY-r.top-p.y};p.moved=false;token.setPointerCapture(e.pointerId);token.classList.add('dragging');$('#hint').textContent='One pointer finger holds. The other pointer finger drags. Lift both to drop.'};
token.onpointermove=e=>{if(!g.drag||g.drag.id!==e.pointerId||g.drag.part!==p.id||e.pointerType!=='mouse')return;const r=board.getBoundingClientRect();const x=Math.max(0,Math.min(r.width-token.offsetWidth,e.clientX-r.left-g.drag.dx)),y=Math.max(0,Math.min(r.height-token.offsetHeight,e.clientY-r.top-g.drag.dy));if(Math.hypot(x-p.x,y-p.y)>2)p.moved=true;p.x=x;p.y=y;token.style.left=x+'px';token.style.top=y+'px'};
token.onpointerup=e=>{if(!g.drag||g.drag.id!==e.pointerId||g.drag.part!==p.id||e.pointerType!=='mouse')return;g.drag=null;token.classList.remove('dragging');p.attempts++;const correct=p.moved&&isPartCorrect(p);if(p.attempts===1)p.firstRelease=correct;const center=partCenter(p);if(!correct&&parts.some(q=>q.id!==p.id&&inside(center,$('#target-'+q.id).getBoundingClientRect())))p.incorrectDrops++;token.classList.toggle('placed',correct);$('#hint').textContent='Your part stays where you drop it. Move another part, or pick this one up again.';};
const cancel=()=>{if(g.drag?.part!==p.id)return;g.drag=null;token.classList.remove('dragging');$('#hint').textContent='The move paused. Pick up the part again.'};token.onpointercancel=cancel;token.onlostpointercapture=cancel;}
document.querySelectorAll('[data-hear]').forEach(b=>b.onclick=()=>{const p=parts[Number(b.dataset.hear)];speech(g.activity.theme==='space'?(partInfo[p.label]?.clue||p.label):p.label)});window.onblur=()=>{if(!g.drag)return;const p=parts[g.drag.part];$('#token-'+p.id).classList.remove('dragging');g.drag=null;$('#hint').textContent='The move paused. Pick up a part again.'};}
function partCenter(p){const r=$('#token-'+p.id).getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
function isPartCorrect(p){return p.attempts>0&&inside(partCenter(p),$('#target-'+p.id).getBoundingClientRect())}
function finishBoard(){const g=game;g.trials.push(...g.boardParts.map(p=>({phase:g.phase,itemLabel:p.label,attempts:p.attempts,success:isPartCorrect(p),firstRelease:p.firstRelease&&isPartCorrect(p),incorrectDrops:p.incorrectDrops})));g.boardParts=null;if(g.phase==='practice'){view='intro';app.innerHTML=`<div class="checkintro panel"><div class="big">⌨</div><span class="eyebrow">Practice complete</span><h1>Now it’s your turn.</h1><p>Five computer parts. Five different places.<br>Move them in any order, then check your board.</p><p class="note">You can pick a part up again. This is not a race.</p><button class="primary" id="beginCheck">Start my five practicals →</button></div>`;$('#beginCheck').onclick=()=>{g.phase='check';g.index=0;showGame()}}else showReview()}
function showReview(){view='review';const checks=game.trials.filter(t=>t.phase==='check');const stats=summarize(game.trials);app.innerHTML=`<div class="eyebrow">Computer-parts review</div><h1>Let’s review what you know.</h1><p>You matched ${stats.completed} of 5 parts in your practical. Read or listen, then think about one thing you learned.</p><div class="reviewcards">${checks.map((t,i)=>`<article class="reviewcard"><div class="reviewpic">${partArt(t.itemLabel)}</div><div><h2>${esc(t.itemLabel)}</h2><p>${esc(partInfo[t.itemLabel]?.clue||'A part from our review board.')}</p><span class="reviewstatus">${t.success?'✓ Matched in my practical':'↻ Keep practicing this match'}</span></div><button class="read" data-review-read="${i}" aria-label="Read about ${esc(t.itemLabel)}">◖)) Read</button></article>`).join('')}</div><div class="savebar"><p class="note">Sharing prompt: “The ____ helps me ____.”</p><button class="primary" id="reviewDone">Rate my skills ⭐</button></div>`;document.querySelectorAll('[data-review-read]').forEach(b=>b.onclick=()=>{const t=checks[Number(b.dataset.reviewRead)];speech(t.itemLabel+'. '+(partInfo[t.itemLabel]?.clue||'A part from our review board.'))});$('#reviewDone').onclick=reflection;}
function reflection(){view='reflect';const stats=summarize(game.trials);app.innerHTML=`<div class="eyebrow">Success criteria check</div><h1>Look what you practiced.</h1><div class="summary"><div class="stat"><strong>${stats.completed}/5</strong><span>Parts matched</span></div><div class="stat"><strong>${stats.first}/5</strong><span>Matched on the first release</span></div><div class="stat"><strong>One next step</strong><span>Think about what you will practice.</span></div></div><div class="sectionline"><h2>I know I’ve got it when…</h2><button class="read" id="read">◖)) Read my success criteria</button></div><p class="note">Choose your stars for each skill. ⭐ I need help · ⭐⭐ With a reminder · ⭐⭐⭐ By myself</p><div class="reflection">${steps.map((s,i)=>`<div class="reflectrow"><b><span class="num" style="display:inline-grid;margin-right:9px">${i+1}</span>I can ${esc(s[0].toLowerCase()+s.slice(1))}</b><div class="rating">${['I need help','With a reminder','By myself'].map((r,j)=>`<button data-self="${i}" data-value="${j+1}" class="${self[i]===j+1?'active':''}" aria-label="${j+1} ${j===0?'star':'stars'}: ${r}" aria-pressed="${self[i]===j+1}"><span class="ratingstars" aria-hidden="true">${'⭐'.repeat(j+1)}</span><span>${r}</span></button>`).join('')}</div></div>`).join('')}</div><div class="savebar"><span class="note">Your answers help your teacher.<br>The game checks your moves. Your teacher checks how you use both hands.</span><button class="primary" id="save" ${self.some(v=>!v)?'disabled':''}>Save my check ✓</button></div><div id="saveError"></div>`;$('#read').onclick=readCriteria;document.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>{self[Number(b.dataset.self)]=Number(b.dataset.value);reflection()});$('#save').onclick=saveResult}
async function saveResult(){const b=$('#save');b.disabled=true;b.textContent='Saving…';const result={id:game.id,activityId:game.activity.id,className,studentNumber:student,trials:game.trials,self,criteriaVersion:3,touchBlocked};try{if(offline){const key='trackpad-local-results',rows=JSON.parse(localStorage.getItem(key)||'[]');rows.push({...result,date:new Date().toISOString(),firstRelease:summarize(game.trials).first,completed:summarize(game.trials).completed,activityTitle:game.activity.title,studentLabel:roster()[student-1]||student,teacherObservation:'Not observed'});localStorage.setItem(key,JSON.stringify(rows));}else await api({action:'result',result});view='done';app.innerHTML=`<div class="checkintro panel"><div class="big">🌟</div><span class="eyebrow">${offline?'Saved on this device':'Saved for your teacher'}</span><h1>You did it, ${esc(roster()[student-1]||'Student '+student)}!</h1><p>Think of one thing to share:<br>“I can ____.” or “Next time I will ____.”</p><button class="read" id="hearShare">◖)) Read my sharing prompt</button><p class="note">${offline?'This downloaded copy keeps results in this browser.':'Your teacher can see your moves and your self-check.'}</p><button class="primary" id="done">Back to adventures →</button></div>`;$('#hearShare').onclick=()=>speech('Think of one thing to share. I can. Or, next time I will.');$('#done').onclick=home;}catch(e){$('#saveError').innerHTML='<p class="error">'+esc(e.message)+'</p>';b.disabled=false;b.textContent='Try saving again';}}
$('#teacherBtn').onclick=()=>{view='teacher';app.innerHTML=`<div class="checkintro panel"><span class="eyebrow">Teacher corner</span><h1>Your classroom controls.</h1><p>Unlock activities, add a practice pack, and check student progress.</p>${offline?'<p class="note">Downloaded copy: settings and results are local to this browser. Use Export student page to distribute your chosen locks.</p>':'<div class="field"><label for="teacherCode">Teacher code</label><input type="password" id="teacherCode" autocomplete="off" placeholder="Enter your teacher code"></div>'}<button class="primary" id="teacherLogin">Open teacher corner →</button><p id="loginError"></p><button class="quiet" id="studentBack">Back to student page</button></div>`;$('#studentBack').onclick=home;$('#teacherLogin').onclick=async()=>{try{if(offline){teacherResults=JSON.parse(localStorage.getItem('trackpad-local-results')||'[]');teacher()}else{teacherKey=$('#teacherCode').value;const d=await api(null,true);config=d.config;teacherResults=d.results;teacher()}}catch(e){$('#loginError').textContent=e.message}}};

function download(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function teacher(){view='teacher';app.innerHTML=`<div class="teacherbar"><div><span class="eyebrow">Teacher corner</span><h1>Small moves. Real progress.</h1></div><button class="quiet" id="studentView">Student view →</button></div><div class="teachgrid"><section class="panel"><h2>Classroom setup</h2><div class="field"><label>Class names · one per line</label><textarea id="classNames">${esc(config.classes.join('\n'))}</textarea></div><div class="field"><label>Student numbers · 1 to 60</label><input id="maxNumber" type="number" min="1" max="60" value="${config.maxNumber}"></div><p class="small">Choose which homeroom’s names to edit:</p><div class="choices">${config.classes.map(c=>`<button class="chip ${c===(adminClass||config.classes[0])?'active':''}" data-roster-class="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="field"><label>Optional names for ${esc(adminClass||config.classes[0])} · one per number</label><textarea id="roster" placeholder="Leave blank to use numbers only">${esc((config.rosters?.[adminClass||config.classes[0]]||[]).join('\n'))}</textarea></div><p class="teacherhelp">Numbers keep setup quick. Pair each number with a class so repeated numbers stay distinct. Names are saved separately for each homeroom. Rename the Homeroom 15 placeholder to your remaining class.</p><button class="primary" id="saveSetup">Save classroom setup</button><div id="setupStatus"></div></section><section class="panel"><h2>Weekly activities</h2><p class="small">Set availability for:</p><div class="choices"><button class="chip ${!adminClass?'active':''}" data-admin-class="">All homerooms</button>${config.classes.map(c=>`<button class="chip ${adminClass===c?'active':''}" data-admin-class="${esc(c)}">${esc(c)}</button>`).join('')}</div><p class="teacherhelp">Week 1 starts open. Week 2 starts locked. Homeroom-specific changes affect only that class; All homerooms resets individual overrides. Lock changes apply to student devices on their next refresh, within about 12 seconds while connected.</p><div id="activityEditors">${config.activities.map((a,i)=>`<div class="activityedit"><div class="row"><input data-title="${i}" aria-label="Activity title" value="${esc(a.title)}"><button class="toggle ${activityLocked(a)?'':'on'}" data-lock="${i}">${(adminClass?(config.activityLocks?.[adminClass]?.[a.id]??a.locked):a.locked)?'🔒 Unlock':'✓ Open · Lock'}</button></div><div class="field"><label>Week or short description</label><input data-subtitle="${i}" value="${esc(a.subtitle)}"></div><div class="field"><label>Six part names or short labels · separated by |</label><input data-items="${i}" value="${esc(a.items.join(' | '))}"></div></div>`).join('')}</div><button class="quiet" id="addActivity">+ Add a practice activity</button> <button class="primary" id="saveActivities">Save activity changes</button><p class="teacherhelp">Added activities use the same movable-card board. Screen, Keyboard, Trackpad, Mouse, Cursor, and Headphones show illustrated parts; other text shows on a card. They start locked. No external pages are embedded, so the touch restriction stays active.</p><div id="activityStatus"></div></section></div><section class="panel" style="margin-top:24px"><div class="teacherbar"><h2>Student checks</h2><div><button class="quiet" id="refresh">Refresh results</button> <button class="quiet" id="csv">Download CSV</button></div></div><p class="teacherhelp">The board reviews computer knowledge and drag control together. First-release matches reflect both, so they are not a pure motor-skill score. Review each part and watch the student to identify what needs help. A mouse and trackpad send the same input type. The game cannot verify how both hands and pointer fingers are used: use the observation buttons after watching the student. Self-check stars follow Both hands / Pointer finger holds / Other pointer finger drags / Lift both to drop (1 help, 2 reminder, 3 independent). Earlier checks show a dash for Both hands because they did not assess that criterion.</p><div class="choices" style="margin-bottom:16px"><button class="chip ${!resultClass?'active':''}" data-result-class="">All classes</button>${config.classes.map(c=>`<button class="chip ${resultClass===c?'active':''}" data-result-class="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="tablewrap"><table><thead><tr><th>Student / class</th><th>Activity / date</th><th>Completed</th><th>First release</th><th>Parts needing review</th><th>Self-check</th><th>Two-hand observation</th></tr></thead><tbody>${teacherResults.filter(r=>!resultClass||r.className===resultClass).map(r=>{const stat=r.trials?summarize(r.trials):{completed:r.completed,first:r.firstRelease};return `<tr><td><b>${esc(r.studentLabel||r.studentNumber)}</b><br>${esc(r.className)} · #${r.studentNumber}</td><td>${esc(r.activityTitle)}<br>${esc(new Date(r.date).toLocaleString())}</td><td>${stat.completed}/5</td><td>${stat.first}/5</td><td>${esc((r.trials||[]).filter(t=>t.phase==='check'&&!t.success).map(t=>t.itemLabel||'Part').join(', ')||'All matched')}</td><td>${normalizedSelf(r).map(v=>v?'⭐'.repeat(v):'—').join(' / ')}</td><td><span>${esc(r.teacherObservation||'Not observed')}</span><br>${['Observed','Reminder needed','Not observed'].map(v=>`<button class="chip" data-observe="${esc(r.id)}" data-value="${v}">${v}</button>`).join('')}</td></tr>`}).join('')}</tbody></table>${!teacherResults.length?'<div class="empty">No completed checks yet. Student results will appear here after they save.</div>':''}</div></section><section class="panel" style="margin-top:24px"><h2>Assign by homeroom</h2><p class="teacherhelp">Copy each class link into that homeroom’s Google Classroom. The page will already show their homeroom; students choose only their number or name.</p><div class="choices">${config.classes.map(c=>`<button class="chip" data-class-link="${esc(c)}">Copy ${esc(c)} link ↗</button>`).join('')}</div></section><section class="panel" style="margin-top:24px"><h2>A standalone copy</h2><p class="teacherhelp">Export a single HTML file you can host elsewhere or open in a browser. Exported copies include the saved activities and locks. In those copies, results stay on each device and lock changes do not sync between computers. Use the hosted version for one shared results list and live locks.</p><button class="quiet" id="exportPage">Download standalone student page</button><p class="teacherhelp">Teacher code is never included in the exported file. On a standalone file the teacher corner is a local utility, not a protected account. Students can edit that local copy; hosted locks are enforced by the server.</p></section>`;
