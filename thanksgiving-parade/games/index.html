<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a9efff"><title>Ms. Kaple’s Parade Games</title><link rel="stylesheet" href="arcade.css"><link rel="stylesheet" href="game-match.css"><link rel="stylesheet" href="game-order.css"><link rel="stylesheet" href="game-maze.css?v=nyc-art-1"><link rel="stylesheet" href="parade-type.css"></head>
<body><div class="ribbon"></div><header class="mast"><div class="buildings"></div><img class="mast-art left" src="brand/caterpillar.webp" alt=""><img class="mast-art right" src="brand/teddy.webp" alt=""><div><img class="maker-logo" src="brand/maker.webp" alt="Ms. Kaple’s Thanksgiving Day Parade Maker"><h1>Parade Games</h1><p>Pick a game to play!</p></div></header>

<section class="cards" id="arcadeCards" aria-label="Choose a game"></section><section class="play-area" id="playArea" aria-labelledby="gameTitle" hidden><h2 id="gameTitle" tabindex="-1"></h2><div id="gameBody"></div></section>
<p class="preview-note">First grade • No timers, logins, or student data.</p></main>
<script src="game-match.js"></script><script src="game-maze.js?v=nyc-art-1"></script><script src="game-order.js"></script><script src="arcade.js?v=maker-return-1"></script></body></html>
