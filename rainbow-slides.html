<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arrow Adventure · Week 1 JPEG slides</title><style>@font-face{font-family:VAG;src:url('https://shannonkaple.github.io/Taskscreen/VAG-Rounded-Std-Black_47296.ttf')}body{margin:0;background:#f2f4fc;color:#28365c;font:17px VAG,Arial,sans-serif}header,main{max-width:1300px;margin:auto;padding:18px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}button,a{font:inherit;color:inherit}button{background:white;border:2px solid #d8def2;border-radius:12px;padding:11px 16px;cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #edaa36;outline-offset:3px}.buttons{display:flex;gap:8px;flex-wrap:wrap}canvas{width:100%;height:auto;display:block;box-shadow:0 5px 25px #28365c1a;border-radius:12px}#status{min-height:24px}#thumbnails{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button.active{background:#8253cf;color:white}body.full{background:#111}body.full header,body.full #thumbnails,body.full #status{display:none}body.full main{padding:0;max-width:none;height:100dvh;display:grid;place-items:center}body.full canvas{max-height:100dvh;max-width:177.77dvh;width:100%;height:auto;border-radius:0}</style></head><body><header><div><b>Week 1 · Learning the arrow keys</b><br><a href="rainbow-road.html">Open the practice game</a></div><div class="buttons"><button id="prev">← Previous</button><button id="next">Next →</button><button id="present">Present</button><button id="jpg">Download this JPEG</button><button id="zip">Download all JPEGs</button></div></header><main><canvas id="slide" aria-label="Teaching slide"></canvas><p id="status" role="status">Loading your classroom fonts…</p><div id="thumbnails"></div></main><script type="module">
import {slides,drawSlide,fontsReady} from './rainbow-road/slides.mjs';
const canvas=document.getElementById('slide'),status=document.getElementById('status');let index=0,busy=false;
async function show(n){index=Math.max(0,Math.min(slides.length-1,n));await drawSlide(canvas,index);status.textContent=(index+1)+' / '+slides.length+' · '+slides[index].title;document.querySelectorAll('[data-index]').forEach(b=>b.classList.toggle('active',Number(b.dataset.index)===index));document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1;window.__slideReady=true;}
const jpgBlob=c=>new Promise(r=>c.toBlob(r,'image/jpeg',.95));
function download(blob,file){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function crc(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=c&1?0xedb88320^(c>>>1):c>>>1}return(c^0xffffffff)>>>0}
function zipFiles(files){const locals=[],central=[];let offset=0;const enc=new TextEncoder();for(const f of files){const name=enc.encode(f.name),data=f.data,checksum=crc(data),local=new Uint8Array(30+name.length),v=new DataView(local.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint32(14,checksum,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);local.set(name,30);locals.push(local,data);const h=new Uint8Array(46+name.length),d=new DataView(h.buffer);d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint32(16,checksum,true);d.setUint32(20,data.length,true);d.setUint32(24,data.length,true);d.setUint16(28,name.length,true);d.setUint32(42,offset,true);h.set(name,46);central.push(h);offset+=local.length+data.length}const size=central.reduce((s,a)=>s+a.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,files.length,true);v.setUint16(10,files.length,true);v.setUint32(12,size,true);v.setUint32(16,offset,true);return new Blob([...locals,...central,end],{type:'application/zip'})}
document.getElementById('thumbnails').innerHTML=slides.map((s,i)=>'<button data-index="'+i+'">'+(i+1)+'</button>').join('');document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>show(Number(b.dataset.index)));document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);
document.getElementById('present').onclick=()=>{document.body.classList.add('full');document.documentElement.requestFullscreen?.().catch(()=>{})};document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('full')});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(index-1)}if(e.key==='Escape')document.body.classList.remove('full')});
document.getElementById('jpg').onclick=async()=>{await fontsReady();download(await jpgBlob(canvas),'arrow-week-1-'+String(index+1).padStart(2,'0')+'.jpg')};
document.getElementById('zip').onclick=async()=>{if(busy)return;busy=true;try{const c=document.createElement('canvas'),files=[];for(let i=0;i<slides.length;i++){status.textContent='Creating JPEG '+(i+1)+' of '+slides.length+'…';await drawSlide(c,i);files.push({name:'arrow-week-1-'+String(i+1).padStart(2,'0')+'.jpg',data:new Uint8Array(await(await jpgBlob(c)).arrayBuffer())})}download(zipFiles(files),'Ms-Kaple-Arrow-Keys-Week-1-JPEGs.zip');await show(index)}catch(e){status.textContent='Could not create slides: '+e.message}finally{busy=false}};
window.renderLessonSlide=async i=>{const c=document.createElement('canvas');await drawSlide(c,i);return c.toDataURL('image/jpeg',.95)};show(0).catch(e=>status.textContent='The classroom fonts could not load. Check your connection and reload. '+e.message);
</script></body></html>
